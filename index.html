<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>world.execute(me);</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap');

        :root {
            --main-bg: #0a0a0a;
            --text-color: #00ff41;
            --highlight-color: #f0f0f0;
            --error-color: #ff3333;
            --love-color: #ff69b4;
            --bsod-bg: #0000aa;
            --bsod-text: #ffffff;
            --font-main: 'Share Tech Mono', monospace;
            --font-display: 'VT323', monospace;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--main-bg);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            text-shadow: 0 0 5px var(--text-color), 0 0 10px var(--text-color);
        }

        #container {
            position: relative;
            width: 100%; height: 100%;
            padding: 2vw;
        }
        
        /* CRT Effects */
        #container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0;
            bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 3px, 4px 100%;
            pointer-events: none;
            animation: scanline 8s linear infinite;
        }
        #container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0;
            bottom: 0; right: 0;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }
        @keyframes scanline {
            from { background-position: 0 0; }
            to { background-position: 0 100%; }
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--main-bg);
            display: flex; justify-content: center; align-items: center;
            flex-direction: column; cursor: pointer;
            z-index: 100;
            font-size: 2.5em; font-family: var(--font-display);
            transition: opacity 1s;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }
        #overlay-cursor { animation: blink 1s step-end infinite; }

        #visuals {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            font-size: 1.1rem;
            overflow: hidden;
            padding: 32px 14px 32px 14px;
            box-sizing: border-box;
        }

        .line {
            display: block; margin-bottom: 0.5em;
            white-space: pre-wrap;
        }
        .line > .prompt { opacity: 0.6; }
        .cursor {
            display: inline-block; background-color: var(--text-color);
            width: 0.6em; height: 1.2em; vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        .emphasis {
            font-family: var(--font-display);
            font-size: 2.5em; color: var(--highlight-color);
            text-shadow: 0 0 8px var(--highlight-color);
            display: block; text-align: center;
            letter-spacing: 5px; animation: fadeIn 0.5s;
        }
        .error {
            color: var(--error-color); text-shadow: 0 0 8px var(--error-color);
        }
        .love {
            color: var(--love-color); text-shadow: 0 0 8px var(--love-color);
            animation: pulse 1.5s infinite;
        }

        /* Animations */
        @keyframes blink { from, to { background-color: transparent; } 50% { background-color: var(--text-color); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes screenShake { 0%{transform:translate(2px,1px) rotate(0deg)}10%{transform:translate(-1px,-2px) rotate(-.8deg)}20%{transform:translate(-3px,0) rotate(.8deg)}30%{transform:translate(3px,2px) rotate(0deg)}40%{transform:translate(1px,-1px) rotate(.8deg)}50%{transform:translate(-1px,2px) rotate(-.8deg)}60%{transform:translate(-3px,1px) rotate(0deg)}70%{transform:translate(3px,1px) rotate(-.8deg)}80%{transform:translate(-1px,-1px) rotate(.8deg)}90%{transform:translate(2px,2px) rotate(0deg)}100%{transform:translate(1px,-2px) rotate(-.8deg)} }
        @keyframes screenShakeHard {
            0%   { transform: translate(0,0) rotate(0deg); }
            10%  { transform: translate(-6px, 3px) rotate(-1.2deg); }
            20%  { transform: translate(7px, -4px) rotate(1.4deg); }
            30%  { transform: translate(-5px, -3px) rotate(-1.0deg); }
            40%  { transform: translate(6px, 4px) rotate(1.0deg); }
            50%  { transform: translate(-4px, 2px) rotate(-0.8deg); }
            60%  { transform: translate(5px, -2px) rotate(0.8deg); }
            70%  { transform: translate(-3px, 3px) rotate(-0.6deg); }
            80%  { transform: translate(3px, -1px) rotate(0.4deg); }
            90%  { transform: translate(-2px, 1px) rotate(-0.2deg); }
            100% { transform: translate(0,0) rotate(0deg); }
        }
        .screenShake { animation: screenShake 0.18s steps(2) infinite; }
        /* god-challenge: 125.7→131.2s — hard shake on container + explicit green→red palette
           override on lyrics/emphasis/code panels. The .v5-breach panel sets its own colors
           and is unaffected. */
        .god-challenge {
            animation: screenShakeHard 0.22s steps(2) infinite;
        }
        .god-challenge #visuals .line,
        .god-challenge #visuals .line .prompt,
        .god-challenge #visuals .line .text {
            color: #ff5050 !important;
            text-shadow: 0 0 8px var(--error-color), 0 0 14px rgba(255,71,87,0.6) !important;
            transition: color 0.5s ease-out, text-shadow 0.5s ease-out;
        }
        .god-challenge #visuals .line.decay .glitch-ch {
            color: #ffd24a !important;
            text-shadow: 0 0 8px #ffd24a !important;
        }
        .god-challenge #visuals .emphasis {
            color: #ff7878 !important;
            text-shadow: 0 0 12px var(--error-color), 0 0 20px rgba(255,71,87,0.5) !important;
        }
        .god-challenge::after {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at center, rgba(255,40,40,0.0) 0%, rgba(255,30,30,0.28) 60%, rgba(180,0,0,0.55) 100%),
                repeating-linear-gradient(0deg, rgba(255,71,87,0.08) 0 1px, transparent 1px 4px);
            pointer-events: none;
            z-index: 28;
            mix-blend-mode: screen;
            animation: godChallengeFlash 0.5s steps(2) infinite;
        }
        @keyframes godChallengeFlash {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }
        .god-challenge.fading #visuals .line,
        .god-challenge.fading #visuals .line .prompt,
        .god-challenge.fading #visuals .line .text {
            color: #ffa07a !important;
            text-shadow: 0 0 6px #ffa07a !important;
        }
        .god-challenge.fading {
            animation: screenShakeHard 0.32s steps(2) 2;
        }

        /* god-state: applied to <body> simultaneously so external HUDs/matrix react too */
        body.god-state .crt-strip {
            color: #ff5050 !important;
            border-color: #ff5050 !important;
            background: rgba(56, 0, 0, 0.95) !important;
            box-shadow: 0 0 18px rgba(255, 71, 87, 0.7), inset 0 0 14px rgba(255,71,87,0.25);
            animation: stripJitter 0.18s steps(2) infinite;
            transition: color 0.4s, background 0.4s, border-color 0.4s, box-shadow 0.4s;
            text-shadow: 0 0 5px rgba(255,71,87,0.6);
        }
        body.god-state .crt-strip .val,
        body.god-state .crt-strip .ticker,
        body.god-state .crt-strip .key { color: #ff7878 !important; text-shadow: 0 0 6px var(--error-color) !important; }
        body.god-state .crt-strip .ticker.ok    { color: #ffb47a !important; text-shadow: 0 0 6px #ffb47a !important; }
        body.god-state .crt-strip .pulse        { color: #ffd24a !important; text-shadow: 0 0 8px #ffd24a !important; }
        body.god-state .crt-strip .seg + .seg   { border-left-color: rgba(255,71,87,0.55) !important; }
        body.god-state #amb-rain {
            filter: hue-rotate(-120deg) saturate(2.2) brightness(1.1);
            opacity: 0.18 !important;
            transition: filter 0.5s, opacity 0.5s;
        }
        body.god-state.fading .crt-strip {
            color: rgba(255, 170, 130, 0.75);
            background: rgba(20, 8, 4, 0.9) !important;
        }
        body.god-state.fading #amb-rain {
            filter: hue-rotate(-60deg) saturate(1.4);
            opacity: 0.12 !important;
        }
        @keyframes stripJitter {
            0%   { transform: translateX(0); }
            33%  { transform: translateX(-1px); }
            66%  { transform: translateX(1.5px); }
            100% { transform: translateX(-0.5px); }
        }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
        
        /* Updated: Removed rotation, only blur */
        .dizzy { animation: blurEffect 2s linear infinite; }
        @keyframes blurEffect { 
            0% { filter: blur(0); } 
            50% { filter: blur(5px); } 
            100% { filter: blur(0); } 
        }

        .ac-mode { --text-color: #ff4444; }
        .dc-mode { --text-color: #4444ff; }
        /* V6.1.4: breathing blur — 2 in/out cycles within 3s, smooth landing.
           Convey "dizzy → focus → dizzy → focus" pulsing per user feedback. */
        .blind { animation: blindAnim 3s ease-in-out forwards; }
        @keyframes blindAnim {
            0%   { filter: blur(0)     brightness(1.00); }
            18%  { filter: blur(6px)   brightness(0.45); }
            38%  { filter: blur(0.6px) brightness(0.95); }
            60%  { filter: blur(6px)   brightness(0.45); }
            82%  { filter: blur(0.6px) brightness(0.95); }
            100% { filter: blur(0)     brightness(1.00); }
        }
        .time-travel { animation: timeWarp 3s ease-in-out; }
        @keyframes timeWarp { 0% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(180deg) sepia(1); } 100% { filter: hue-rotate(360deg); } }

        /* Special Effects Elements */
        #binary-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }
        /* V6.1: BSOD now full-bleed (covers the whole viewport) — system takeover feel. */
        #bsod-screen {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            box-shadow: inset 0 0 120px rgba(0, 0, 80, 0.55);
        }
        /* V6.1: BSOD takeover hides ambient matrix + scanlines + crt strips so the
           blue field stays clean (god-state hue-shifted rain was bleeding red). */
        body.bsod-active #amb-rain,
        body.bsod-active .crt-strip,
        body.bsod-active #container::before,
        body.bsod-active #container::after { display: none !important; }
        .code-snippet, .progress-bar-container {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--text-color);
            padding: 1em; margin: 1em 0;
            white-space: pre; font-family: var(--font-main);
        }
        .progress-bar { height: 1.2em; background-color: var(--text-color); width: 0; transition: width 1s linear; }
        .token.keyword { color: #cc7832; }
        .token.class-name { color: #a9b7c6; }
        .token.function { color: #ffc66d; }
        .token.string { color: #6a8759; }

        #bsod-screen {
            background-color: var(--bsod-bg);
            color: var(--bsod-text);
            font-family: 'Lucida Console', monospace;
            text-shadow: none;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 50;
        }

        /* ===== V6: REBOOT screen — refined BIOS POST aesthetic (BSOD → reboot → EXECUTION) =====
           A subtle phosphor-CRT look: vignette + scanlines + per-line color codes. Status pills are
           uniform width [OK]/[WARN]/[FATAL]/[..]. Progress bar uses a chunked gradient. The
           ASCII banner gets a soft phosphor breathing glow. */
        #reboot-screen {
            position: fixed; inset: 0;
            background:
                radial-gradient(ellipse at center, #02110a 0%, #000604 70%, #000 100%);
            color: #d8eedf;
            font-family: 'Lucida Console', 'Courier New', monospace;
            font-size: 1.02em;
            text-shadow: 0 0 4px rgba(120,255,170,0.20);
            z-index: 50;
            padding: 4vh 7vw;
            overflow: hidden;
            line-height: 1.6em;
            letter-spacing: 0.4px;
        }
        #reboot-screen.fading { transition: opacity 0.45s ease-out, filter 0.45s; opacity: 0; filter: blur(8px) brightness(2.5); }
        /* CRT scanlines */
        #reboot-screen::before {
            content: '';
            position: absolute; inset: 0;
            background:
                repeating-linear-gradient(0deg, rgba(120,255,170,0.035) 0 1px, transparent 1px 3px);
            pointer-events: none;
            z-index: 1;
        }
        /* phosphor vignette + faint green halo top-bottom */
        #reboot-screen::after {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(60,255,150,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(60,255,150,0.05) 0%, transparent 60%);
            pointer-events: none;
            mix-blend-mode: screen;
            z-index: 1;
        }
        #reboot-screen #rb-body { position: relative; z-index: 2; }
        #reboot-screen .rb-header {
            position: relative; z-index: 2;
            color: #f4fff8;
            border: 1px solid rgba(140,255,180,0.45);
            border-radius: 2px;
            padding: 8px 14px;
            margin-bottom: 18px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.95em;
            letter-spacing: 1.4px;
            background: linear-gradient(180deg, rgba(20,80,50,0.45) 0%, rgba(0,30,18,0.35) 100%);
            box-shadow: 0 0 14px rgba(80,255,160,0.22), inset 0 0 12px rgba(80,255,160,0.08);
        }
        #reboot-screen .rb-header .copyright {
            opacity: 0.78;
            font-size: 0.88em;
            display: flex; align-items: center; gap: 8px;
        }
        #reboot-screen .rb-header .copyright .heart {
            color: #ff6a98;
            text-shadow: 0 0 8px rgba(255,106,152,0.7);
            animation: rbHeartBeat 1.4s ease-in-out infinite;
        }
        @keyframes rbHeartBeat {
            0%, 100% { transform: scale(1); opacity: 1; }
            50%      { transform: scale(1.18); opacity: 0.85; }
        }
        #reboot-screen .rb-line {
            opacity: 0;
            animation: rebootRowIn 0.18s ease-out forwards;
            white-space: pre;
            /* V6.1.5: vertical breathing room between reboot rows so the
               OK/WARN/FATAL tags don't visually crash into adjacent lines */
            line-height: 1.55;
            margin: 1px 0;
        }
        #reboot-screen .rb-line.ok    { color: #6dffae; }
        #reboot-screen .rb-line.warn  { color: #ffd24a; }
        #reboot-screen .rb-line.fatal { color: #ff5b5b; }
        #reboot-screen .rb-line.dim   { opacity: 0.6; color: #9bd6b3; }
        #reboot-screen .rb-line.section {
            color: #b8ffe0;
            opacity: 0.7;
            margin-top: 10px;
            letter-spacing: 4px;
            font-size: 0.82em;
            border-bottom: 1px dashed rgba(180,255,224,0.22);
            padding-bottom: 2px;
            margin-bottom: 4px;
        }
        /* uniform-width status pill */
        #reboot-screen .rb-line .tag {
            display: inline-block;
            min-width: 64px;
            text-align: center;
            /* V6.1.5: more breathing room around the status pill so OK / WARN
               / FATAL don't visually crash into the line text either side */
            margin-right: 12px;
            padding: 2px 8px;
            border-radius: 3px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.78);
        }
        #reboot-screen .rb-line.ok    .tag { color: #1a3322; background: #6dffae; border-color: #6dffae; }
        #reboot-screen .rb-line.warn  .tag { color: #3a2700; background: #ffd24a; border-color: #ffd24a; }
        #reboot-screen .rb-line.fatal .tag { color: #fff;    background: #ff5b5b; border-color: #ff5b5b; }
        #reboot-screen .rb-line .pct {
            color: #6dffae;
        }
        #reboot-screen .rb-line .pct.warn { color: #ffd24a; }
        /* chunked progress bar */
        #reboot-screen .rb-bar {
            height: 14px; margin: 6px 0 4px;
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,0.06) 0 12px, transparent 12px 14px),
                rgba(255,255,255,0.04);
            border: 1px solid rgba(140,255,190,0.5);
            position: relative;
            opacity: 0;
            animation: rebootRowIn 0.18s ease-out forwards;
            box-shadow: 0 0 8px rgba(80,255,160,0.18), inset 0 0 6px rgba(80,255,160,0.05);
        }
        #reboot-screen .rb-bar > span {
            display: block;
            height: 100%;
            background:
                repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 12px, transparent 12px 14px),
                linear-gradient(90deg, #4dffae 0%, #b8ffd6 60%, #fff 100%);
            box-shadow: 0 0 8px rgba(77,255,174,0.55);
            width: 0;
            transition: width 1.4s linear;
        }
        /* progress percent label aligned to right of bar */
        #reboot-screen .rb-bar-label {
            opacity: 0;
            animation: rebootRowIn 0.18s ease-out forwards;
            color: #b8ffd6;
            font-size: 0.86em;
            letter-spacing: 1.5px;
            text-align: right;
            margin-top: -2px;
            margin-bottom: 6px;
        }
        /* ASCII banner — display:inline-block + auto margins centers the pre block as
           a unit, preserving column alignment (text-align would offset each line). */
        #reboot-screen .rb-banner {
            display: block;
            margin: 18px auto 8px;
            width: max-content;
            color: #c8ffea;
            text-shadow: 0 0 10px rgba(120,255,180,0.7), 0 0 20px rgba(120,255,180,0.35);
            font-size: 1.15em;
            line-height: 1.05em;
            white-space: pre;
            opacity: 0;
            animation: rebootRowIn 0.3s ease-out forwards, rbBannerBreathe 2.4s ease-in-out 0.4s infinite;
        }
        @keyframes rbBannerBreathe {
            0%, 100% { text-shadow: 0 0 8px rgba(120,255,180,0.6),  0 0 18px rgba(120,255,180,0.32); transform: scale(1); }
            50%      { text-shadow: 0 0 14px rgba(160,255,220,0.95), 0 0 28px rgba(120,255,180,0.55); transform: scale(1.012); }
        }
        #reboot-screen .rb-prompt {
            color: #b8ffd6;
            font-size: 0.95em;
            letter-spacing: 1px;
            margin-top: 6px;
            opacity: 0;
            animation: rebootRowIn 0.18s ease-out forwards;
        }
        #reboot-screen .rb-prompt .ts {
            opacity: 0.6; margin-right: 8px; font-size: 0.85em;
        }
        #reboot-screen .rb-cursor {
            display: inline-block;
            background: #d8ffe6;
            width: 0.55em; height: 1em;
            vertical-align: -2px;
            box-shadow: 0 0 6px rgba(180,255,210,0.7);
            animation: blink 0.6s step-end infinite;
        }
        @keyframes rebootRowIn {
            from { opacity: 0; transform: translateY(2px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes rebootGlitch {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(2px); }
        }
        .bsod-text { font-size: 1.2em; text-align: center; }
        .bsod-dump { font-size: 0.8em; margin-top: 2em; }

        .shape { position: absolute; }
        .point, .sine-dot { width: 5px; height: 5px; background-color: var(--highlight-color); border-radius: 50%; box-shadow: 0 0 10px var(--highlight-color); }
        .circle { border: 2px solid var(--highlight-color); border-radius: 50%; box-shadow: 0 0 15px var(--highlight-color); animation: fadeIn 1s; }
        .tangent-line { border-top: 1px dashed var(--love-color); transform-origin: left center; }
        .limit-line { border-top: 2px solid var(--error-color); }

        .chaos-text {
            position: absolute; font-family: var(--font-display);
            opacity: 0.8; animation: fadeIn 0.2s;
        }

        /* New effect styles */
        .emoji-display {
            position: absolute;
            font-size: 3em;
            animation: bounceIn 0.8s ease-out;
            z-index: 15;
        }
        @keyframes bounceIn {
            0% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(360deg); opacity: 1; }
        }

        .gender-symbol {
            position: absolute;
            font-size: 4em;
            animation: genderSwitch 1s ease-in-out;
            z-index: 15;
        }
        @keyframes genderSwitch {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg) scale(1.2); }
            100% { transform: rotateY(180deg); }
        }

        .time-display {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-size: 2em;
            background: rgba(0,0,0,0.8);
            padding: 0.5em;
            border: 2px solid var(--text-color);
            animation: digitalClock 2s ease-in-out;
        }
        @keyframes digitalClock {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.9; transform: scale(1); }
        }

        .molecule {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ff6b6b, #4ecdc4);
            border-radius: 50%;
            animation: moleculeFloat 3s ease-in-out infinite;
        }
        @keyframes moleculeFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .sound-wave {
            position: absolute;
            height: 4px;
            background: linear-gradient(to right, var(--love-color), transparent);
            animation: soundWave 1s ease-in-out infinite;
        }
        @keyframes soundWave {
            0% { width: 0; opacity: 1; }
            100% { width: 200px; opacity: 0; }
        }

        .year-display {
            position: absolute;
            font-family: var(--font-display);
            font-size: 3em;
            color: gold;
            text-shadow: 0 0 10px gold;
            animation: timeTravel 0.5s ease-in-out;
        }
        @keyframes timeTravel {
            0% { opacity: 0; transform: scale(2) rotateX(90deg); }
            100% { opacity: 1; transform: scale(1) rotateX(0deg); }
        }

        /* legacy class kept so clearShapes can still target it */
        .unite-effect {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 3px solid var(--love-color);
            border-radius: 50%;
            animation: unite 2s ease-in-out;
        }
        @keyframes unite {
            0% { transform: scale(0.1); opacity: 0; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* V6.1: "And we can unite / So deeply, so deeply" — three-phase reactive scene.
           Phase 1: two horizontal streams sweep from opposite edges toward center.
           Phase 2: collision flash + merge sigil at center.
           Phase 3: concentric depth rings expand outward (the "deeply" gravity well).
        */
        .v61-unite-stage {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 7;
            overflow: hidden;
        }
        .v61-unite-stage .ust-stream {
            position: absolute;
            top: 50%; height: 2px;
            transform: translateY(-50%);
            opacity: 0;
            filter: blur(0.3px);
            mix-blend-mode: screen;
        }
        .v61-unite-stage .ust-stream.left {
            left: -2%; right: 50%;
            background: linear-gradient(90deg, transparent 0%, rgba(110,255,199,0.05) 12%, rgba(110,255,199,0.85) 92%, #d8ffe9 100%);
            box-shadow: 0 0 14px rgba(110,255,199,0.85), 0 0 36px rgba(110,255,199,0.55);
            animation: ust-sweep-left 1.6s cubic-bezier(.55,0,.4,1) forwards;
        }
        .v61-unite-stage .ust-stream.right {
            left: 50%; right: -2%;
            background: linear-gradient(270deg, transparent 0%, rgba(255,106,168,0.05) 12%, rgba(255,106,168,0.85) 92%, #ffd6e6 100%);
            box-shadow: 0 0 14px rgba(255,106,168,0.85), 0 0 36px rgba(255,106,168,0.55);
            animation: ust-sweep-right 1.6s cubic-bezier(.55,0,.4,1) forwards;
        }
        @keyframes ust-sweep-left {
            0%   { opacity: 0; transform: translate(-50%, -50%) scaleX(0.05); }
            18%  { opacity: 0.4; }
            70%  { opacity: 1;   transform: translate(0, -50%) scaleX(1); }
            100% { opacity: 0;   transform: translate(0, -50%) scaleX(1); }
        }
        @keyframes ust-sweep-right {
            0%   { opacity: 0; transform: translate(50%, -50%) scaleX(0.05); }
            18%  { opacity: 0.4; }
            70%  { opacity: 1;   transform: translate(0, -50%) scaleX(1); }
            100% { opacity: 0;   transform: translate(0, -50%) scaleX(1); }
        }
        /* trailing particles each side — small dots that leave streaks */
        .v61-unite-stage .ust-trail {
            position: absolute; top: 50%;
            width: 6px; height: 6px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
        }
        .v61-unite-stage .ust-trail.left {
            background: #6effc7;
            box-shadow: 0 0 10px #6effc7, 0 0 22px rgba(110,255,199,0.5);
            animation: ust-trail-left 1.6s ease-out forwards;
        }
        .v61-unite-stage .ust-trail.right {
            background: #ff6aa8;
            box-shadow: 0 0 10px #ff6aa8, 0 0 22px rgba(255,106,168,0.5);
            animation: ust-trail-right 1.6s ease-out forwards;
        }
        @keyframes ust-trail-left  { 0%{left:-2%; opacity:0;} 12%{opacity:1;} 65%{left:50%; opacity:1;} 100%{left:50%; opacity:0;} }
        @keyframes ust-trail-right { 0%{left:102%; opacity:0;} 12%{opacity:1;} 65%{left:50%; opacity:1;} 100%{left:50%; opacity:0;} }

        /* phase 2: collision flash + merge sigil */
        .v61-unite-stage .ust-flash {
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            background: radial-gradient(circle, #ffffff 0%, #ffe6f0 22%, rgba(255,180,210,0.6) 48%, rgba(160,80,140,0.0) 75%);
            mix-blend-mode: screen;
            animation: ust-flash 1.4s ease-out forwards;
            animation-delay: 1.4s;
            box-shadow: 0 0 60px rgba(255,255,255,0.8);
        }
        @keyframes ust-flash {
            0%   { opacity: 0; width: 0; height: 0; }
            12%  { opacity: 1; width: 280px; height: 280px; }
            45%  { opacity: 0.85; width: 260px; height: 260px; }
            100% { opacity: 0; width: 200px; height: 200px; }
        }
        .v61-unite-stage .ust-sigil {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            opacity: 0;
            font-family: var(--font-main);
            font-size: 0.78em;
            color: rgba(255, 235, 245, 0.95);
            text-shadow: 0 0 8px rgba(255,180,210,0.9), 0 0 22px rgba(255,106,168,0.7);
            text-align: center;
            line-height: 1.6em;
            letter-spacing: 1.2px;
            white-space: pre;
            animation: ust-sigil 2.0s cubic-bezier(.2,1,.4,1) forwards;
            animation-delay: 1.55s;
        }
        @keyframes ust-sigil {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
            22%  { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
            70%  { opacity: 0.85; transform: translate(-50%, -50%) scale(1.0); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.96); }
        }

        /* phase 3: depth rings — concentric, fade in sequence to feel "deeply".
           V6.1.4: ring anim shortened 2.2s → 1.6s, ring count reduced to 4 in JS,
           stagger 0.18s → 0.12s. Total scene now 3.4s vs the 3.76s nextClear. */
        .v61-unite-stage .ust-ring {
            position: absolute;
            top: 50%; left: 50%;
            border: 1.5px solid rgba(255,180,210,0.85);
            border-radius: 50%;
            box-shadow: 0 0 22px rgba(255,180,210,0.7), inset 0 0 22px rgba(255,180,210,0.35);
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            mix-blend-mode: screen;
            animation: ust-ring 1.6s cubic-bezier(.2,.6,.3,1) forwards;
        }
        @keyframes ust-ring {
            0%   { transform: translate(-50%, -50%) scale(0.05); opacity: 0; }
            14%  { opacity: 0.95; }
            100% { transform: translate(-50%, -50%) scale(7);    opacity: 0; }
        }
        /* depth well: subtle parallax of nested vignettes pulling inward, gives the
           "diving deeper" sensation underneath the rings */
        .v61-unite-stage .ust-well {
            position: absolute;
            top: 50%; left: 50%;
            width: 240px; height: 240px;
            transform: translate(-50%, -50%) scale(0.4);
            opacity: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, rgba(80,20,60,0.0) 0%, rgba(120,40,90,0.45) 38%, rgba(60,10,50,0.85) 70%, rgba(20,4,18,0.95) 100%);
            mix-blend-mode: multiply;
            animation: ust-well 1.6s ease-out forwards;
            animation-delay: 1.7s;
            filter: blur(2px);
        }
        @keyframes ust-well {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
            22%  { opacity: 0.85; transform: translate(-50%, -50%) scale(1.0); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); }
        }
        /* DEEPLY label that pulses twice at the rhythm of "deeply, deeply" */
        .v61-unite-stage .ust-deeply {
            position: absolute;
            top: calc(50% + 90px); left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-display);
            font-size: 1.2em;
            letter-spacing: 8px;
            color: rgba(255, 200, 220, 0.92);
            text-shadow: 0 0 10px rgba(255,140,180,0.85), 0 0 28px rgba(255,90,150,0.7);
            opacity: 0;
            animation: ust-deeply 1.7s ease-in-out forwards;
            animation-delay: 1.6s;
            mix-blend-mode: screen;
        }
        @keyframes ust-deeply {
            0%   { opacity: 0; letter-spacing: 24px; }
            15%  { opacity: 1; letter-spacing: 8px; }
            45%  { opacity: 0.45; letter-spacing: 6px; }
            70%  { opacity: 1;    letter-spacing: 4px; }
            100% { opacity: 0;    letter-spacing: 2px; }
        }

        /* V6.1 trance — hypnotic kaleidoscope. Three rotating ray layers (8/16/24-fold)
           at counter-rotating speeds + a breathing radial pulse + a single bright
           center pupil that contracts/dilates, evoking deep hypnotic absorption. */
        /* V6.1.3 trance — BIO-LINK terminal:
           Lyric is "Oh switch my role / To S, to M / So we can enter / The trance".
           Reads as "two consciousnesses synchronizing into a S/M trance state"
           — code-aesthetic match: a HUD-style bio-link panel with ME/YOU columns
           (heart-rate / breath / brainwave bars syncing), center merge progress
           bar 0→100%, T-3..T-0 countdown, white flash, [ TRANCE :: ENGAGED ] stamp.
           Total 1.85s — fits the 1.95s lyric window before clearScreen at 102.88s. */
        .trance-stage {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 12;
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            animation: trsFade 1.85s ease-out forwards;
        }
        @keyframes trsFade {
            0%   { opacity: 0; }
            6%   { opacity: 1; }
            82%  { opacity: 1; }
            100% { opacity: 0; }
        }
        .trance-stage .tp-bg {
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 50%, rgba(40,10,80,0.7) 0%, rgba(15,5,40,0.92) 60%, rgba(0,0,0,0.97) 100%);
            mix-blend-mode: multiply;
            animation: trsBgIn 0.4s ease-out forwards;
            opacity: 0;
        }
        @keyframes trsBgIn { to { opacity: 0.9; } }

        .trance-stage .trance-panel {
            position: relative;
            width: min(820px, 88vw);
            background: rgba(8, 14, 22, 0.94);
            border: 1px solid rgba(180, 100, 255, 0.7);
            box-shadow: 0 0 32px rgba(180, 100, 255, 0.45), inset 0 0 16px rgba(180, 100, 255, 0.12);
            padding: 16px 22px 14px;
            font-family: var(--font-display);
            color: #d4c8ff;
            transform: translateY(36px) scale(0.92);
            opacity: 0;
            animation: trsPanelIn 0.30s cubic-bezier(.3,1.6,.5,1) forwards;
        }
        @keyframes trsPanelIn {
            0%   { opacity: 0; transform: translateY(36px) scale(0.92); filter: blur(8px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        .trance-panel .tp-head {
            display: flex; justify-content: space-between;
            font-size: 0.82em; letter-spacing: 3px;
            color: rgba(255,180,255,0.92);
            text-shadow: 0 0 8px rgba(180,100,255,0.6);
            border-bottom: 1px dashed rgba(180,100,255,0.4);
            padding-bottom: 5px; margin-bottom: 8px;
        }
        .trance-panel .tp-head .blip { color: #ff5cae; animation: blink 0.4s step-end infinite; margin-right: 4px; }

        .trance-panel .tp-cols {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 14px;
            margin-bottom: 8px;
        }
        .trance-panel .tp-divider {
            background: linear-gradient(180deg, transparent, rgba(180,100,255,0.55), transparent);
            width: 1px;
        }
        .trance-panel .tp-col h3 {
            font-size: 0.92em; letter-spacing: 4px;
            margin: 0 0 6px;
            font-weight: 600;
        }
        .trance-panel .tp-col.tp-me  h3 { color: #6effc7; text-shadow: 0 0 8px rgba(110,255,199,0.6); }
        .trance-panel .tp-col.tp-you h3 { color: #ff6aa8; text-shadow: 0 0 8px rgba(255,106,168,0.6); }

        .trance-panel .tp-row {
            display: flex; align-items: center;
            gap: 8px;
            margin: 3px 0;
            font-size: 0.74em;
            opacity: 0;
            animation: trsRowIn 0.22s ease-out forwards;
        }
        .trance-panel .tp-row .tp-lbl { width: 86px; opacity: 0.65; letter-spacing: 1px; }
        .trance-panel .tp-row .tp-bar {
            flex: 1; height: 7px;
            position: relative;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(180,100,255,0.32);
            overflow: hidden;
        }
        .trance-panel .tp-row .tp-bar > i {
            display: block; height: 100%;
            width: var(--w, 60%);
            background: linear-gradient(90deg, currentColor 0%, rgba(255,255,255,0.55) 100%);
            box-shadow: 0 0 6px currentColor;
            transform: scaleX(0); transform-origin: 0 50%;
            animation: trsBarFill 0.42s ease-out forwards;
            animation-delay: inherit;
        }
        .trance-panel .tp-col.tp-me  .tp-row { color: #6effc7; }
        .trance-panel .tp-col.tp-you .tp-row { color: #ff6aa8; }
        @keyframes trsRowIn  { to { opacity: 1; } }
        @keyframes trsBarFill { to { transform: scaleX(1); } }

        .trance-panel .tp-merge {
            margin-top: 6px;
            font-size: 0.78em; letter-spacing: 3px;
            color: rgba(255,200,255,0.92);
            text-shadow: 0 0 6px rgba(180,100,255,0.5);
        }
        .trance-panel .tp-merge .label { display: block; margin-bottom: 3px; opacity: 0.78; }
        .trance-panel .tp-merge .bar {
            height: 14px; position: relative;
            background: rgba(0,0,0,0.45);
            border: 1px solid rgba(180,100,255,0.55);
            overflow: hidden;
        }
        .trance-panel .tp-merge .bar > i {
            display: block; height: 100%; width: 0%;
            background: linear-gradient(90deg, #6effc7 0%, #c896ff 50%, #ff6aa8 100%);
            box-shadow: 0 0 12px rgba(180,100,255,0.7);
            animation: trsMergeFill 0.65s 0.50s cubic-bezier(.3,.7,.4,1) forwards;
        }
        @keyframes trsMergeFill { to { width: 100%; } }
        .trance-panel .tp-merge .pct {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            color: #fff; text-shadow: 0 0 4px rgba(0,0,0,0.85);
            font-size: 0.92em;
            opacity: 0;
            animation: trsRowIn 0.18s 1.10s ease-out forwards;
        }

        .trance-panel .tp-countdown {
            margin-top: 10px;
            font-size: 1.5em; letter-spacing: 8px;
            text-align: center;
            color: rgba(255,200,255,0.95);
            text-shadow: 0 0 12px rgba(180,100,255,0.85);
            opacity: 0;
            animation: trsRowIn 0.18s 1.20s ease-out forwards, trsCountPulse 0.32s 1.20s ease-in-out 3 forwards;
        }
        @keyframes trsCountPulse {
            0%, 100% { transform: scale(1);   filter: brightness(1); }
            50%      { transform: scale(1.08); filter: brightness(1.5); }
        }
        .trance-panel .tp-foot {
            margin-top: 6px;
            font-size: 0.66em;
            color: rgba(180,180,200,0.62);
            border-top: 1px dashed rgba(180,100,255,0.28);
            padding-top: 4px;
            letter-spacing: 1px;
        }

        .trance-stage .tp-flash {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.95) 0%, rgba(180,100,255,0.45) 28%, transparent 60%);
            opacity: 0;
            animation: trsFlash 0.36s 1.05s ease-out forwards;
            mix-blend-mode: screen;
            pointer-events: none;
        }
        @keyframes trsFlash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

        /* V6.1.4: pull stamp 0.5s earlier (1.60s → 1.10s) so user has ~0.7s of
           clearly readable [ TRANCE :: ENGAGED ] before the stage exits at 1.85s. */
        .trance-stage .tp-stamp {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            font-family: var(--font-display);
            font-size: 2.2em;
            font-weight: 700;
            letter-spacing: 10px;
            color: #fff;
            text-shadow: 0 0 16px rgba(255,180,255,0.95), 0 0 32px rgba(180,100,255,0.7);
            border: 3px solid rgba(255,180,255,0.85);
            padding: 8px 24px;
            background: rgba(40,15,60,0.85);
            box-shadow: 0 0 28px rgba(180,100,255,0.65);
            opacity: 0;
            white-space: nowrap;
            animation: trsStampSlam 0.30s 1.10s cubic-bezier(.3,1.6,.4,1) forwards;
        }
        @keyframes trsStampSlam {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(2.0) rotate(-3deg); filter: blur(8px); }
            70%  { opacity: 1; transform: translate(-50%, -50%) scale(0.95) rotate(1deg); filter: blur(0); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
        }

        /* V6.1: TRAPPED CAGE — for "Though we are trapped... We are trapped ah-"
           Six iron bars slam down, three horizontal rails clamp behind them,
           red vignette closes in, and a [ TRAPPED ] stamp slams center then
           pulses twice. Total 3.6s — fits the 3.85s lyric→clearScreen window. */
        .trapped-stage {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 11;
            opacity: 0;
            animation: trpFade 3.6s ease-out forwards;
        }
        @keyframes trpFade { 0% { opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }

        .trapped-stage .trp-tint {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(120,20,20,0) 28%, rgba(120,20,20,0.55) 100%);
            mix-blend-mode: multiply;
            opacity: 0;
            animation: trpTintIn 1.0s ease-out forwards, trpTintOut 0.7s 2.9s ease-in forwards;
        }
        @keyframes trpTintIn  { to { opacity: 0.9; } }
        @keyframes trpTintOut { to { opacity: 0; } }

        .trapped-stage .trp-bar {
            position: absolute;
            top: -8%; bottom: -8%;
            width: 14px;
            background: linear-gradient(90deg,
                rgba(60,20,20,0)   0%,
                rgba(180,60,60,0.55) 25%,
                rgba(255,140,140,0.95) 50%,
                rgba(180,60,60,0.55) 75%,
                rgba(60,20,20,0)   100%);
            box-shadow: 0 0 14px rgba(255,80,80,0.65), inset 0 0 4px rgba(255,255,255,0.3);
            transform: translateY(-115%);
            animation: trpBarDrop 0.55s cubic-bezier(.4,1.65,.55,1) forwards;
            border-radius: 2px;
        }
        @keyframes trpBarDrop {
            0%   { transform: translateY(-115%); }
            68%  { transform: translateY(4%); }
            85%  { transform: translateY(-1.5%); }
            100% { transform: translateY(0); }
        }

        .trapped-stage .trp-rail {
            position: absolute;
            left: -10%; right: -10%;
            height: 5px;
            background:
                linear-gradient(90deg, rgba(255,80,80,0) 0%, rgba(255,100,100,0.7) 50%, rgba(255,80,80,0) 100%),
                repeating-linear-gradient(90deg, rgba(0,0,0,0.4) 0 12px, transparent 12px 16px);
            box-shadow: 0 0 10px rgba(255,80,80,0.5);
            opacity: 0;
            animation: trpRailIn 0.42s ease-out forwards;
        }
        @keyframes trpRailIn { 0% { opacity: 0; transform: scaleX(0.4); } 60% { opacity: 1; transform: scaleX(1.04); } 100% { opacity: 0.95; transform: scaleX(1); } }

        .trapped-stage .trp-stamp {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%) scale(0.4) rotate(-6deg);
            font-family: var(--font-display);
            font-size: 3.6em;
            font-weight: 700;
            letter-spacing: 14px;
            color: #ff5b5b;
            text-shadow: 0 0 12px rgba(255,80,80,0.9), 0 0 30px rgba(255,80,80,0.55);
            border: 4px double #ff5b5b;
            padding: 10px 32px;
            background: rgba(15,2,2,0.7);
            box-shadow: 0 0 28px rgba(255,80,80,0.5), inset 0 0 14px rgba(255,80,80,0.3);
            opacity: 0;
            animation: trpStampSlam 0.5s 0.95s cubic-bezier(.3,1.6,.4,1) forwards,
                       trpStampPulse 0.85s 1.65s ease-in-out 2 forwards;
            white-space: nowrap;
        }
        @keyframes trpStampSlam {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(2.4) rotate(-6deg); filter: blur(10px); }
            55%  { opacity: 1; transform: translate(-50%, -50%) scale(0.94) rotate(2deg); filter: blur(0); }
            80%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(-1deg); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); }
        }
        @keyframes trpStampPulse {
            0%, 100% { filter: brightness(1); }
            50%      { filter: brightness(1.45); transform: translate(-50%, -50%) scale(1.04); }
        }
        /* small chain decorations behind the stamp */
        .trapped-stage .trp-chain {
            position: absolute;
            left: 50%; top: 50%;
            font-family: var(--font-display);
            font-size: 1.05em;
            color: rgba(255,140,140,0.55);
            text-shadow: 0 0 6px rgba(255,80,80,0.5);
            white-space: nowrap;
            opacity: 0;
            animation: trpChainIn 0.35s 1.4s forwards, trpChainSwing 1.2s 1.75s ease-in-out infinite;
            transform: translate(-50%, -50%);
        }
        @keyframes trpChainIn { 0% { opacity: 0; } 100% { opacity: 0.85; } }
        @keyframes trpChainSwing {
            0%, 100% { transform: translate(-50%, -50%) rotate(-2deg); }
            50%      { transform: translate(-50%, -50%) rotate(2deg); }
        }
        
        /* V6.1.4: POWER stage — "Switch on the power line" thematic boot.
           Breaker flips (red→green), lightning arcs out, grid traces light up,
           [ POWER :: ON ] stamp punctuates. Total ~1.15s (window 1.30s). */
        .power-stage {
            position: fixed;
            inset: 0;
            z-index: 12;
            pointer-events: none;
            overflow: hidden;
        }
        /* breaker switch */
        .power-stage .ps-breaker {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: 92px; height: 130px;
            background: rgba(0,8,4,0.92);
            border: 2px solid var(--text-color);
            box-shadow: 0 0 18px rgba(0,255,65,0.45), inset 0 0 12px rgba(0,255,65,0.15);
            border-radius: 6px;
            font-family: var(--font-main);
            opacity: 0;
            animation: psBreakerIn 0.22s ease-out forwards, psBreakerOut 0.30s 0.85s ease-in forwards;
        }
        @keyframes psBreakerIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); filter: blur(4px); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1);   filter: blur(0); }
        }
        @keyframes psBreakerOut {
            from { opacity: 1; }
            to   { opacity: 0; transform: translate(-50%, -50%) scale(1.15); filter: blur(6px) brightness(1.6); }
        }
        .power-stage .ps-breaker .ps-lever {
            position: absolute;
            left: 50%; bottom: 12%;
            width: 14px; height: 70px;
            background: linear-gradient(180deg, #ffd166 0%, #c97a00 100%);
            box-shadow: 0 0 8px rgba(255,180,80,0.8);
            transform-origin: 50% 100%;
            transform: translateX(-50%) rotate(45deg);
            border-radius: 4px;
            animation: psLeverFlip 0.28s 0.30s cubic-bezier(.4,1.4,.5,1) forwards;
        }
        @keyframes psLeverFlip {
            0%   { transform: translateX(-50%) rotate(45deg);  background: linear-gradient(180deg, #ff5252, #a02020); }
            55%  { transform: translateX(-50%) rotate(-15deg); background: linear-gradient(180deg, #ffd166, #c97a00); }
            100% { transform: translateX(-50%) rotate(0deg);   background: linear-gradient(180deg, #5dffb1, #00aa55); }
        }
        .power-stage .ps-breaker .ps-label-off,
        .power-stage .ps-breaker .ps-label-on {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.78em;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .power-stage .ps-breaker .ps-label-off {
            top: 8%;
            color: #ff5252;
            text-shadow: 0 0 6px rgba(255,80,80,0.8);
            animation: psLabelHide 0.25s 0.30s forwards;
        }
        .power-stage .ps-breaker .ps-label-on {
            top: 8%;
            color: #5dffb1;
            text-shadow: 0 0 8px rgba(93,255,177,0.95);
            opacity: 0;
            animation: psLabelShow 0.25s 0.55s forwards;
        }
        @keyframes psLabelHide { to { opacity: 0; } }
        @keyframes psLabelShow { to { opacity: 1; } }
        /* lightning arcs spreading from center */
        .power-stage .ps-arc {
            position: absolute;
            left: 50%; top: 50%;
            width: 2px;
            background: linear-gradient(180deg, transparent 0%, #fff 35%, #5dffb1 50%, #5dffb1 65%, transparent 100%);
            box-shadow: 0 0 12px #5dffb1, 0 0 22px rgba(93,255,177,0.6);
            transform-origin: 50% 0;
            transform: translate(-50%, 0) rotate(var(--ang, 0deg)) scaleY(0);
            opacity: 0;
            animation: psArc 0.40s 0.50s ease-out forwards;
        }
        @keyframes psArc {
            0%   { opacity: 0; transform: translate(-50%, 0) rotate(var(--ang, 0deg)) scaleY(0); }
            25%  { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, 0) rotate(var(--ang, 0deg)) scaleY(1); filter: blur(2px); }
        }
        /* grid traces igniting */
        .power-stage .ps-trace {
            position: absolute;
            background: linear-gradient(90deg, transparent 0%, #5dffb1 50%, transparent 100%);
            box-shadow: 0 0 10px rgba(93,255,177,0.7);
            opacity: 0;
            animation: psTrace 0.45s var(--td, 0.55s) ease-out forwards;
        }
        .power-stage .ps-trace.h { height: 2px; left: 0; right: 0; transform: scaleX(0); transform-origin: 50% 0; }
        .power-stage .ps-trace.v { width: 2px; top: 0; bottom: 0; transform: scaleY(0); transform-origin: 0 50%; background: linear-gradient(180deg, transparent 0%, #5dffb1 50%, transparent 100%); }
        @keyframes psTrace {
            0%   { opacity: 0; transform: scale3d(0,0,1); }
            45%  { opacity: 1; transform: scale3d(1,1,1); }
            100% { opacity: 0; transform: scale3d(1,1,1); }
        }
        /* white screen flash */
        .power-stage .ps-flash {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.95) 0%, rgba(93,255,177,0.45) 25%, transparent 60%);
            opacity: 0;
            animation: psFlash 0.30s 0.50s ease-out forwards;
            mix-blend-mode: screen;
        }
        @keyframes psFlash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
        /* "POWER :: ON" stamp */
        .power-stage .ps-stamp {
            position: absolute;
            left: 50%; bottom: 22%;
            transform: translateX(-50%) scale(0.6);
            font-family: var(--font-display);
            font-size: 1.2em;
            font-weight: 700;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 10px #5dffb1, 0 0 22px rgba(93,255,177,0.7);
            border: 2px solid #5dffb1;
            background: rgba(0,30,15,0.85);
            padding: 5px 14px;
            box-shadow: 0 0 18px rgba(93,255,177,0.55);
            opacity: 0;
            white-space: nowrap;
            animation: psStamp 0.35s 0.65s cubic-bezier(.3,1.6,.4,1) forwards;
        }
        @keyframes psStamp {
            0%   { opacity: 0; transform: translateX(-50%) scale(1.6) rotate(-3deg); filter: blur(6px); }
            70%  { opacity: 1; transform: translateX(-50%) scale(0.95) rotate(1deg); filter: blur(0); }
            100% { opacity: 1; transform: translateX(-50%) scale(1) rotate(0); }
        }
        
        /* New: Protection shield */
        .protection-shield {
            position: absolute;
            border: 3px solid var(--text-color);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--text-color);
            animation: shieldPulse 2s infinite;
            z-index: 10;
        }
        @keyframes shieldPulse {
            0% { transform: scale(0.5); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.5); opacity: 0.5; }
        }
        
        /* New: Object creation effect */
        .object-particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--text-color);
            border-radius: 50%;
            animation: particleFloat 3s ease-in-out;
            z-index: 7;
        }
        @keyframes particleFloat {
            0% { transform: translateY(0) scale(0.2); opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }

        /* ===== DIMENSION ladder ===== */
        .dim-stage {
            position: absolute;
            left: 0; right: 0;
            top: 55%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6vw;
            perspective: 800px;
            z-index: 12;
            pointer-events: none;
        }
        .dim-step {
            position: relative;
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.6);
            animation: dimAppear 0.55s ease-out forwards;
        }
        .dim-step .label {
            display: block;
            margin-bottom: 0.5em;
            font-family: var(--font-display);
            font-size: 1.4em;
            color: var(--text-color);
            text-shadow: 0 0 8px var(--text-color);
            letter-spacing: 2px;
        }
        @keyframes dimAppear {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .dim-0d {
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--text-color);
            box-shadow: 0 0 14px var(--text-color), 0 0 28px var(--text-color);
            margin: 27px auto 0;
            animation: dimPulse 1.2s ease-in-out infinite;
        }
        @keyframes dimPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
        .dim-1d {
            width: 90px; height: 3px;
            background: var(--text-color);
            box-shadow: 0 0 8px var(--text-color);
            margin: 33px auto 0;
            position: relative;
        }
        .dim-1d::before, .dim-1d::after {
            content: '';
            position: absolute;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--text-color);
            box-shadow: 0 0 8px var(--text-color);
            top: -3px;
        }
        .dim-1d::before { left: -4px; }
        .dim-1d::after { right: -4px; }
        .dim-2d {
            width: 70px; height: 70px;
            border: 2px solid var(--text-color);
            box-shadow: 0 0 12px var(--text-color), inset 0 0 12px rgba(0,255,65,0.25);
            margin: 0 auto;
            position: relative;
        }
        .dim-2d::before {
            content: '';
            position: absolute; inset: 0;
            background:
                linear-gradient(0deg, transparent 49%, rgba(0,255,65,0.25) 50%, transparent 51%),
                linear-gradient(90deg, transparent 49%, rgba(0,255,65,0.25) 50%, transparent 51%);
        }
        .dim-cube-wrap {
            width: 70px; height: 70px;
            margin: 0 auto;
            perspective: 320px;
        }
        .dim-cube {
            position: relative;
            width: 70px; height: 70px;
            transform-style: preserve-3d;
            animation: dimRotate3d 5s linear infinite;
        }
        .dim-cube .face {
            position: absolute;
            width: 70px; height: 70px;
            border: 2px solid var(--text-color);
            box-shadow: 0 0 8px var(--text-color);
            background: rgba(0,255,65,0.06);
        }
        .dim-cube .f-front  { transform: translateZ(35px); }
        .dim-cube .f-back   { transform: rotateY(180deg) translateZ(35px); }
        .dim-cube .f-right  { transform: rotateY(90deg) translateZ(35px); }
        .dim-cube .f-left   { transform: rotateY(-90deg) translateZ(35px); }
        .dim-cube .f-top    { transform: rotateX(90deg) translateZ(35px); }
        .dim-cube .f-bottom { transform: rotateX(-90deg) translateZ(35px); }
        @keyframes dimRotate3d {
            from { transform: rotateX(0) rotateY(0); }
            to   { transform: rotateX(360deg) rotateY(360deg); }
        }
        .dim-tess {
            position: relative;
            width: 90px; height: 90px;
            margin: 0 auto;
            perspective: 360px;
            transform-style: preserve-3d;
        }
        .dim-tess .dim-cube { position: absolute; inset: 10px; }
        .dim-tess .dim-cube.outer {
            inset: 0;
            width: 90px; height: 90px;
            animation-duration: 6s;
        }
        .dim-tess .dim-cube.outer .face { width: 90px; height: 90px; }
        .dim-tess .dim-cube.outer .f-front  { transform: translateZ(45px); }
        .dim-tess .dim-cube.outer .f-back   { transform: rotateY(180deg) translateZ(45px); }
        .dim-tess .dim-cube.outer .f-right  { transform: rotateY(90deg) translateZ(45px); }
        .dim-tess .dim-cube.outer .f-left   { transform: rotateY(-90deg) translateZ(45px); }
        .dim-tess .dim-cube.outer .f-top    { transform: rotateX(90deg) translateZ(45px); }
        .dim-tess .dim-cube.outer .f-bottom { transform: rotateX(-90deg) translateZ(45px); }
        .dim-tess .dim-cube.inner {
            inset: 25px;
            width: 40px; height: 40px;
            animation: dimRotate3dInv 4s linear infinite;
        }
        .dim-tess .dim-cube.inner .face {
            width: 40px; height: 40px;
            border-color: var(--love-color);
            box-shadow: 0 0 8px var(--love-color);
            background: rgba(255,105,180,0.08);
        }
        .dim-tess .dim-cube.inner .f-front  { transform: translateZ(20px); }
        .dim-tess .dim-cube.inner .f-back   { transform: rotateY(180deg) translateZ(20px); }
        .dim-tess .dim-cube.inner .f-right  { transform: rotateY(90deg) translateZ(20px); }
        .dim-tess .dim-cube.inner .f-left   { transform: rotateY(-90deg) translateZ(20px); }
        .dim-tess .dim-cube.inner .f-top    { transform: rotateX(90deg) translateZ(20px); }
        .dim-tess .dim-cube.inner .f-bottom { transform: rotateX(-90deg) translateZ(20px); }
        @keyframes dimRotate3dInv {
            from { transform: rotateX(0) rotateY(0); }
            to   { transform: rotateX(-360deg) rotateY(-360deg); }
        }

        /* ===== Sine wave (SVG) ===== */
        .sine-svg {
            position: absolute;
            left: 5%;
            top: 35%;
            width: 90%;
            height: 35%;
            z-index: 11;
            pointer-events: none;
            overflow: visible;
        }
        .sine-svg .axis {
            stroke: rgba(240,240,240,0.18);
            stroke-width: 1;
            stroke-dasharray: 4 6;
        }
        .sine-svg .grid {
            stroke: rgba(240,240,240,0.08);
            stroke-width: 1;
        }
        .sine-svg .sine-path {
            fill: none;
            stroke: var(--highlight-color);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 6px var(--highlight-color));
        }
        .sine-svg .sine-glow {
            fill: none;
            stroke: var(--highlight-color);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.25;
            filter: blur(2px);
        }
        .sine-formula {
            position: absolute;
            right: 8%;
            top: 26%;
            font-family: var(--font-display);
            font-size: 1.6em;
            color: var(--highlight-color);
            text-shadow: 0 0 8px var(--highlight-color);
            opacity: 0;
            animation: sineFormulaIn 0.8s 0.7s forwards;
            z-index: 12;
            letter-spacing: 2px;
        }
        @keyframes sineFormulaIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 0.95; transform: translateY(0); }
        }

        /* ===== Tangents (SVG) ===== */
        .tangent-svg {
            position: absolute;
            left: 5%;
            top: 35%;
            width: 90%;
            height: 35%;
            z-index: 12;
            pointer-events: none;
            overflow: visible;
        }
        .tangent-svg .tline {
            stroke: var(--love-color);
            stroke-width: 2;
            stroke-dasharray: 7 4;
            stroke-linecap: round;
            filter: drop-shadow(0 0 5px var(--love-color));
            opacity: 0;
            animation: tangentDraw 0.45s ease-out forwards;
        }
        .tangent-svg .tdot {
            fill: var(--love-color);
            filter: drop-shadow(0 0 6px var(--love-color));
            opacity: 0;
            animation: tangentDot 0.35s ease-out forwards;
        }
        .tangent-svg .ttri {
            fill: none;
            stroke: var(--love-color);
            stroke-width: 1.2;
            opacity: 0;
            animation: tangentTri 0.45s ease-out forwards;
        }
        @keyframes tangentDraw { to { opacity: 0.95; } }
        @keyframes tangentDot  { to { opacity: 1; } }
        @keyframes tangentTri  { to { opacity: 0.7; } }

        /* ===== S / M role switch ===== */
        .sm-letter {
            position: absolute;
            font-family: var(--font-display);
            font-size: 8em;
            font-weight: bold;
            line-height: 1;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 16;
            pointer-events: none;
        }
        .sm-letter.s {
            left: 28%;
            color: #ff3b3b;
            text-shadow: 0 0 18px #ff3b3b, 0 0 36px #ff3b3b, 0 0 54px rgba(255,59,59,0.5);
            opacity: 0;
            animation:
                smPushInLeft 0.55s ease-out forwards,
                smHold 0.9s 0.55s linear forwards,
                smFadeOut 0.6s 1.7s ease-in forwards;
        }
        .sm-letter.m {
            left: 72%;
            color: #b066ff;
            text-shadow: 0 0 18px #b066ff, 0 0 36px #b066ff, 0 0 54px rgba(176,102,255,0.5);
            opacity: 0;
            animation:
                smPushInRight 0.55s 0.5s ease-out forwards,
                smHold 0.9s 1.05s linear forwards,
                smFadeOut 0.6s 2.0s ease-in forwards;
        }
        @keyframes smPushInLeft {
            from { opacity: 0; transform: translate(-260%, -50%) scale(0.55); filter: blur(8px); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }
        @keyframes smPushInRight {
            from { opacity: 0; transform: translate(180%, -50%) scale(0.55); filter: blur(8px); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }
        @keyframes smHold {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%      { transform: translate(-50%, -50%) scale(1.07); }
        }
        @keyframes smFadeOut {
            from { opacity: 1; }
            to   { opacity: 0; }
        }

        .sm-spike {
            position: absolute;
            left: 28%;
            top: 50%;
            width: 4px;
            height: 110px;
            background: linear-gradient(to top, transparent, #ff3b3b 35%, #ffffff 50%, #ff3b3b 65%, transparent);
            border-radius: 2px;
            box-shadow: 0 0 10px #ff3b3b;
            transform-origin: 50% 100%;
            transform: translate(-50%, -100%) rotate(var(--angle)) scaleY(0);
            opacity: 0;
            animation:
                smSpikeIn 0.45s ease-out forwards,
                smSpikeOut 0.4s 1.25s forwards;
            z-index: 15;
        }
        @keyframes smSpikeIn {
            0%   { transform: translate(-50%, -100%) rotate(var(--angle)) scaleY(0); opacity: 0; }
            100% { transform: translate(-50%, -100%) rotate(var(--angle)) scaleY(1); opacity: 0.95; }
        }
        @keyframes smSpikeOut {
            from { opacity: 0.95; }
            to   { opacity: 0; transform: translate(-50%, -100%) rotate(var(--angle)) scaleY(1.4); }
        }

        .sm-ring {
            position: absolute;
            left: 72%;
            top: 50%;
            width: 90px;
            height: 90px;
            border: 2px solid #b066ff;
            border-radius: 50%;
            box-shadow: 0 0 14px #b066ff, inset 0 0 14px rgba(176,102,255,0.3);
            transform: translate(-50%, -50%);
            opacity: 0;
            animation: smRingExpand 1.5s ease-out forwards;
            z-index: 14;
        }
        @keyframes smRingExpand {
            0%   { width: 90px; height: 90px; opacity: 0; }
            15%  { opacity: 0.9; }
            100% { width: 380px; height: 380px; opacity: 0; }
        }

        .sm-chain-dot {
            position: absolute;
            top: 50%;
            width: 9px; height: 9px;
            border-radius: 50%;
            background: #ff8df0;
            box-shadow: 0 0 8px #ff66ff, 0 0 16px #ff66ff;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            animation:
                smChainIn 0.35s ease-out forwards,
                smChainPulse 0.9s ease-in-out infinite,
                smChainOut 0.4s 1.7s forwards;
            z-index: 15;
        }
        @keyframes smChainIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes smChainPulse {
            0%, 100% { box-shadow: 0 0 8px #ff66ff, 0 0 16px #ff66ff; }
            50%      { box-shadow: 0 0 14px #ff66ff, 0 0 28px #ff66ff; }
        }
        @keyframes smChainOut {
            to { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        }

        /* ===========================================================
           HACKER-V2 OVERRIDES & ADDITIONS
           Replaces dim ladder, sine HUD, tangent labels, S/M sudo screen
           =========================================================== */

        /* --- shared hacker chrome --- */
        .hk-panel {
            position: absolute;
            background: rgba(0, 18, 8, 0.62);
            border: 1px solid var(--text-color);
            box-shadow:
                0 0 14px rgba(0,255,65,0.45),
                inset 0 0 22px rgba(0,255,65,0.10);
            font-family: var(--font-main);
            color: var(--text-color);
            padding: 0.65em 0.9em;
            text-shadow: 0 0 4px var(--text-color);
            z-index: 13;
            pointer-events: none;
            overflow: hidden;
        }
        .hk-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 18px;
            background: linear-gradient(90deg, rgba(0,255,65,0.28), rgba(0,255,65,0.04));
            border-bottom: 1px dashed rgba(0,255,65,0.55);
            pointer-events: none;
        }
        .hk-panel .hk-title {
            position: relative;
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            letter-spacing: 2px;
            opacity: 0.95;
            padding: 0 0.2em 0.55em;
            border-bottom: 1px dashed rgba(0,255,65,0.35);
            margin-bottom: 0.55em;
            text-transform: uppercase;
        }
        .hk-panel .hk-title .blip {
            color: var(--love-color);
            text-shadow: 0 0 6px var(--love-color);
            animation: blink 0.9s step-end infinite;
        }
        .hk-panel .hk-row {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            column-gap: 0.85em;
            font-size: 1em;
            line-height: 1.45em;
            opacity: 0;
            animation: hkRowIn 0.35s ease-out forwards;
        }
        .hk-panel .hk-row .hk-tag { color: var(--love-color); text-shadow: 0 0 5px var(--love-color); }
        .hk-panel .hk-row .hk-key { letter-spacing: 1px; }
        .hk-panel .hk-row .hk-dots { color: rgba(0,255,65,0.45); letter-spacing: 0; }
        .hk-panel .hk-row .hk-val { color: var(--highlight-color); text-shadow: 0 0 6px var(--highlight-color); }
        .hk-panel .hk-row .hk-mini { width: 56px; height: 32px; display: inline-flex; align-items: center; justify-content: center; }
        .hk-panel .hk-foot {
            margin-top: 0.55em;
            padding-top: 0.45em;
            border-top: 1px dashed rgba(0,255,65,0.35);
            font-size: 0.85em;
            display: flex;
            justify-content: space-between;
            opacity: 0.85;
        }
        .hk-panel .hk-foot .warn { color: #ffd24a; text-shadow: 0 0 5px #ffd24a; animation: blink 1.1s step-end infinite; }
        @keyframes hkRowIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* scan beam (vertical sweeping bar reused across panels) */
        .hk-scanbeam {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(0,255,200,0.95), transparent);
            box-shadow: 0 0 18px rgba(0,255,200,0.85);
            opacity: 0.85;
            pointer-events: none;
            animation: hkBeamSweep 2.2s linear infinite;
            z-index: 14;
        }
        @keyframes hkBeamSweep {
            0%   { left: -2%; opacity: 0; }
            10%  { opacity: 0.95; }
            90%  { opacity: 0.95; }
            100% { left: 102%; opacity: 0; }
        }

        /* chromatic glitch utility */
        .hk-glitch {
            position: relative;
            color: var(--text-color);
        }
        .hk-glitch::before, .hk-glitch::after {
            content: attr(data-text);
            position: absolute; left: 0; top: 0;
            width: 100%;
            pointer-events: none;
        }
        .hk-glitch::before { color: #ff3b6b; transform: translate(-1.5px, 0); mix-blend-mode: screen; opacity: 0.85; }
        .hk-glitch::after  { color: #00ffff; transform: translate(1.5px, 0); mix-blend-mode: screen; opacity: 0.75; }

        /* V6.1.4: dimensional morph trail — top-of-viewport visualization that
           shows point → line → plane → cube unfolding alongside the DIM ladder.
           Per user feedback: connect "If I'm a set of points" with "give you my
           DIMENSION" via a literal point→line→surface→volume progression. */
        .dim-morph {
            position: fixed;
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 13;
            pointer-events: none;
            font-family: var(--font-main);
        }
        .dim-morph .dm-stage {
            position: relative;
            width: 90px; height: 90px;
            background: rgba(0,8,4,0.85);
            border: 1.5px solid rgba(0,255,65,0.45);
            box-shadow: 0 0 14px rgba(0,255,65,0.45);
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
        }
        .dim-morph .dm-stage[data-step="0"] { animation: dmStageIn 0.30s 0.05s ease-out forwards; }
        .dim-morph .dm-stage[data-step="1"] { animation: dmStageIn 0.30s 0.25s ease-out forwards; }
        .dim-morph .dm-stage[data-step="2"] { animation: dmStageIn 0.30s 0.45s ease-out forwards; }
        .dim-morph .dm-stage[data-step="3"] { animation: dmStageIn 0.30s 0.65s ease-out forwards; }
        @keyframes dmStageIn {
            0%   { opacity: 0; transform: scale(0.65) translateY(8px); filter: blur(4px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        .dim-morph .dm-arrow {
            color: rgba(0,255,65,0.65);
            font-size: 1.4em;
            text-shadow: 0 0 6px rgba(0,255,65,0.6);
            opacity: 0;
            letter-spacing: 1px;
        }
        .dim-morph .dm-arrow[data-step="01"] { animation: dmStageIn 0.20s 0.22s forwards; }
        .dim-morph .dm-arrow[data-step="12"] { animation: dmStageIn 0.20s 0.42s forwards; }
        .dim-morph .dm-arrow[data-step="23"] { animation: dmStageIn 0.20s 0.62s forwards; }
        .dim-morph .dm-label {
            position: absolute; bottom: -22px; left: 50%;
            transform: translateX(-50%);
            font-size: 0.62em;
            letter-spacing: 2px;
            color: rgba(0,255,65,0.78);
            text-shadow: 0 0 4px rgba(0,255,65,0.6);
            white-space: nowrap;
        }
        /* point */
        .dim-morph .dm-shape.dm-pt {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: var(--text-color);
            box-shadow: 0 0 12px var(--text-color), 0 0 22px rgba(0,255,65,0.5);
        }
        /* line — draws left-to-right */
        .dim-morph .dm-shape.dm-ln {
            width: 0; height: 2px;
            background: var(--text-color);
            box-shadow: 0 0 6px var(--text-color);
            animation: dmLnDraw 0.40s 0.45s ease-out forwards;
        }
        @keyframes dmLnDraw { to { width: 64px; } }
        .dim-morph .dm-shape.dm-ln::before, .dim-morph .dm-shape.dm-ln::after {
            content: ''; position: absolute; top: -2.5px;
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--text-color);
            box-shadow: 0 0 6px var(--text-color);
            opacity: 0;
            animation: dmDotIn 0.20s ease-out forwards;
        }
        .dim-morph .dm-shape.dm-ln::before { left: -3.5px; animation-delay: 0.50s; }
        .dim-morph .dm-shape.dm-ln::after  { right: -3.5px; animation-delay: 0.78s; }
        @keyframes dmDotIn { to { opacity: 1; } }
        /* square — scale up from a single dot */
        .dim-morph .dm-shape.dm-sq {
            width: 50px; height: 50px;
            border: 2px solid var(--text-color);
            box-shadow: 0 0 8px var(--text-color), inset 0 0 6px rgba(0,255,65,0.18);
            background:
                linear-gradient(0deg, transparent 49%, rgba(0,255,65,0.30) 50%, transparent 51%),
                linear-gradient(90deg, transparent 49%, rgba(0,255,65,0.30) 50%, transparent 51%);
            transform: scale(0.18);
            opacity: 0;
            animation: dmSqGrow 0.38s 0.65s cubic-bezier(.3,1.4,.5,1) forwards;
        }
        @keyframes dmSqGrow {
            0%   { opacity: 0; transform: scale(0.18); }
            70%  { opacity: 1; transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1); }
        }
        /* cube — 3D rotating with extruded perspective */
        .dim-morph .dm-shape.dm-cb {
            width: 56px; height: 56px;
            perspective: 240px;
            transform-style: preserve-3d;
            opacity: 0;
            animation: dmCbIn 0.38s 0.85s ease-out forwards;
        }
        .dim-morph .dm-shape.dm-cb .dm-cube {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(-22deg) rotateY(-32deg);
            animation: dmCbSpin 5s 0.85s linear infinite;
        }
        .dim-morph .dm-shape.dm-cb .face {
            position: absolute; width: 56px; height: 56px;
            border: 1.5px solid var(--highlight-color);
            background: rgba(255,150,255,0.06);
            box-shadow: 0 0 6px var(--highlight-color);
        }
        .dim-morph .dm-shape.dm-cb .f-front  { transform: translateZ(28px); }
        .dim-morph .dm-shape.dm-cb .f-back   { transform: rotateY(180deg) translateZ(28px); }
        .dim-morph .dm-shape.dm-cb .f-right  { transform: rotateY(90deg) translateZ(28px); }
        .dim-morph .dm-shape.dm-cb .f-left   { transform: rotateY(-90deg) translateZ(28px); }
        .dim-morph .dm-shape.dm-cb .f-top    { transform: rotateX(90deg) translateZ(28px); }
        .dim-morph .dm-shape.dm-cb .f-bottom { transform: rotateX(-90deg) translateZ(28px); }
        @keyframes dmCbIn {
            0%   { opacity: 0; transform: scale(0.4); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes dmCbSpin {
            from { transform: rotateX(-22deg) rotateY(-32deg); }
            to   { transform: rotateX(-22deg) rotateY(328deg); }
        }

        /* ===== DIMENSION (hacker dim_scan) ===== */
        .hk-dim-stage {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            min-width: 640px;
            max-width: 78vw;
            padding-bottom: 0.2em;
            animation: hkPanelPop 0.35s ease-out;
        }
        @keyframes hkPanelPop {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.94); filter: blur(4px); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }
        .hk-dim-stage .hk-row { padding: 0.05em 0.1em; }
        .hk-dim-stage .hk-row.glitch-row .hk-key,
        .hk-dim-stage .hk-row.glitch-row .hk-val {
            color: var(--love-color);
            text-shadow: 0 0 6px var(--love-color);
        }

        /* mini geometry inside DIM rows */
        .hk-mini .m-point {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text-color);
            box-shadow: 0 0 10px var(--text-color);
            animation: dimPulse 1.2s ease-in-out infinite;
        }
        .hk-mini .m-line {
            width: 44px; height: 2px;
            background: var(--text-color);
            box-shadow: 0 0 8px var(--text-color);
            position: relative;
        }
        .hk-mini .m-line::before, .hk-mini .m-line::after {
            content: '';
            position: absolute; top: -2px;
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--text-color);
            box-shadow: 0 0 6px var(--text-color);
        }
        .hk-mini .m-line::before { left: -3px; }
        .hk-mini .m-line::after  { right: -3px; }
        .hk-mini .m-square {
            width: 28px; height: 28px;
            border: 1.5px solid var(--text-color);
