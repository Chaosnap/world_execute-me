            box-shadow: 0 0 6px var(--text-color), inset 0 0 6px rgba(0,255,65,0.18);
            position: relative;
        }
        .hk-mini .m-square::before {
            content: ''; position: absolute; inset: 0;
            background:
                linear-gradient(0deg, transparent 49%, rgba(0,255,65,0.35) 50%, transparent 51%),
                linear-gradient(90deg, transparent 49%, rgba(0,255,65,0.35) 50%, transparent 51%);
        }
        .hk-mini .m-cube-wrap { width: 32px; height: 32px; perspective: 200px; }
        .hk-mini .m-cube {
            position: relative; width: 32px; height: 32px;
            transform-style: preserve-3d;
            animation: dimRotate3d 4.5s linear infinite;
        }
        .hk-mini .m-cube .face {
            position: absolute; width: 32px; height: 32px;
            border: 1.5px solid var(--text-color);
            background: rgba(0,255,65,0.05);
            box-shadow: 0 0 6px var(--text-color);
        }
        .hk-mini .m-cube .f-front  { transform: translateZ(16px); }
        .hk-mini .m-cube .f-back   { transform: rotateY(180deg) translateZ(16px); }
        .hk-mini .m-cube .f-right  { transform: rotateY(90deg) translateZ(16px); }
        .hk-mini .m-cube .f-left   { transform: rotateY(-90deg) translateZ(16px); }
        .hk-mini .m-cube .f-top    { transform: rotateX(90deg) translateZ(16px); }
        .hk-mini .m-cube .f-bottom { transform: rotateX(-90deg) translateZ(16px); }

        .hk-mini .m-tess { position: relative; width: 40px; height: 40px; perspective: 220px; transform-style: preserve-3d; }
        .hk-mini .m-tess .m-cube.outer { position: absolute; inset: 0; width: 40px; height: 40px; }
        .hk-mini .m-tess .m-cube.outer .face { width: 40px; height: 40px; }
        .hk-mini .m-tess .m-cube.outer .f-front  { transform: translateZ(20px); }
        .hk-mini .m-tess .m-cube.outer .f-back   { transform: rotateY(180deg) translateZ(20px); }
        .hk-mini .m-tess .m-cube.outer .f-right  { transform: rotateY(90deg) translateZ(20px); }
        .hk-mini .m-tess .m-cube.outer .f-left   { transform: rotateY(-90deg) translateZ(20px); }
        .hk-mini .m-tess .m-cube.outer .f-top    { transform: rotateX(90deg) translateZ(20px); }
        .hk-mini .m-tess .m-cube.outer .f-bottom { transform: rotateX(-90deg) translateZ(20px); }
        .hk-mini .m-tess .m-cube.inner {
            position: absolute; inset: 11px; width: 18px; height: 18px;
            animation: dimRotate3dInv 3s linear infinite;
        }
        .hk-mini .m-tess .m-cube.inner .face {
            width: 18px; height: 18px;
            border-color: var(--love-color);
            box-shadow: 0 0 6px var(--love-color);
            background: rgba(255,105,180,0.10);
        }
        .hk-mini .m-tess .m-cube.inner .f-front  { transform: translateZ(9px); }
        .hk-mini .m-tess .m-cube.inner .f-back   { transform: rotateY(180deg) translateZ(9px); }
        .hk-mini .m-tess .m-cube.inner .f-right  { transform: rotateY(90deg) translateZ(9px); }
        .hk-mini .m-tess .m-cube.inner .f-left   { transform: rotateY(-90deg) translateZ(9px); }
        .hk-mini .m-tess .m-cube.inner .f-top    { transform: rotateX(90deg) translateZ(9px); }
        .hk-mini .m-tess .m-cube.inner .f-bottom { transform: rotateX(-90deg) translateZ(9px); }

        /* ===== Sine OSC panel ===== */
        .hk-osc-stage {
            left: 5%; top: 30%;
            width: 90%; height: 42%;
            padding: 36px 18px 18px;
            background: rgba(0, 14, 6, 0.55);
            animation: hkOscIn 0.5s ease-out;
        }
        @keyframes hkOscIn {
            from { opacity: 0; clip-path: inset(45% 0 45% 0); }
            to   { opacity: 1; clip-path: inset(0 0 0 0); }
        }
        .hk-osc-stage .hk-title {
            position: absolute;
            top: 0; left: 0; right: 0;
            margin: 0; padding: 0.35em 0.9em;
            border-bottom: 1px dashed rgba(0,255,65,0.45);
            background: linear-gradient(90deg, rgba(0,255,65,0.22), rgba(0,255,65,0.02));
        }
        .hk-osc-grid {
            position: absolute;
            inset: 36px 18px 18px 18px;
            background-image:
                linear-gradient(rgba(0,255,65,0.10) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,65,0.10) 1px, transparent 1px);
            background-size: 8.33% 12.5%, 8.33% 12.5%;
            pointer-events: none;
            z-index: 1;
        }
        .hk-osc-stage .sine-svg {
            position: absolute;
            inset: 36px 18px 18px 18px;
            width: auto;
            height: auto;
            left: 18px; top: 36px;
            right: 18px; bottom: 18px;
            z-index: 3;
        }
        .hk-osc-stage .tangent-svg {
            position: absolute;
            inset: 36px 18px 18px 18px;
            width: auto; height: auto;
            left: 18px; top: 36px;
            right: 18px; bottom: 18px;
            z-index: 4;
        }
        .hk-osc-hud {
            position: absolute;
            top: 36px; left: 22px;
            display: flex; flex-direction: column;
            gap: 0.15em;
            font-size: 0.85em;
            line-height: 1.4em;
            color: var(--text-color);
            text-shadow: 0 0 4px var(--text-color);
            z-index: 5;
        }
        .hk-osc-hud .hud-row { display: flex; gap: 0.35em; }
        .hk-osc-hud .hud-row .lbl { opacity: 0.7; letter-spacing: 1px; }
        .hk-osc-hud .hud-row .val { color: var(--highlight-color); text-shadow: 0 0 5px var(--highlight-color); min-width: 4ch; }
        .hk-osc-status {
            position: absolute;
            top: 36px; right: 22px;
            font-size: 0.85em;
            color: var(--love-color);
            text-shadow: 0 0 5px var(--love-color);
            letter-spacing: 2px;
            animation: blink 0.9s step-end infinite;
            z-index: 5;
        }
        .hk-osc-stage .sine-formula {
            position: absolute;
            right: 26px; top: 36%;
            color: var(--highlight-color);
            font-family: var(--font-display);
            font-size: 1.4em;
            opacity: 0;
            animation: sineFormulaIn 0.8s 0.6s forwards;
            z-index: 5;
        }
        .hk-hex-stream {
            position: absolute;
            left: 0; right: 0; bottom: 6px;
            font-size: 0.78em;
            color: rgba(0,255,65,0.55);
            white-space: nowrap;
            overflow: hidden;
            padding: 0 22px;
            letter-spacing: 1px;
            font-family: var(--font-main);
            z-index: 5;
        }
        .hk-hex-stream span {
            display: inline-block;
            animation: hkHexScroll 12s linear infinite;
            padding-left: 100%;
        }
        @keyframes hkHexScroll {
            from { transform: translateX(0); }
            to   { transform: translateX(-100%); }
        }

        /* tangent labels */
        .hk-tlabel {
            position: absolute;
            font-family: var(--font-main);
            font-size: 0.72em;
            color: var(--love-color);
            text-shadow: 0 0 5px var(--love-color);
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,105,180,0.55);
            padding: 1px 5px;
            letter-spacing: 1px;
            opacity: 0;
            animation: hkTLabelIn 0.45s ease-out forwards;
            transform: translate(-50%, -50%);
            z-index: 6;
            pointer-events: none;
        }
        @keyframes hkTLabelIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            to   { opacity: 0.95; transform: translate(-50%, -50%) scale(1); }
        }
        .hk-inject-panel {
            position: absolute;
            right: 10%;
            bottom: -2.6em;
            transform: translateY(100%);
            min-width: 220px;
            background: rgba(0, 18, 8, 0.78);
            border: 1px solid var(--love-color);
            box-shadow: 0 0 12px rgba(255,105,180,0.5);
            padding: 0.4em 0.7em;
            font-size: 0.78em;
            color: var(--love-color);
            text-shadow: 0 0 4px var(--love-color);
            font-family: var(--font-main);
            z-index: 7;
            animation: hkInjectIn 0.4s ease-out;
        }
        @keyframes hkInjectIn {
            from { opacity: 0; transform: translateY(120%); }
            to   { opacity: 1; transform: translateY(100%); }
        }
        .hk-inject-panel .ip-title {
            border-bottom: 1px dashed rgba(255,105,180,0.45);
            padding-bottom: 0.2em;
            margin-bottom: 0.3em;
            letter-spacing: 2px;
        }
        .hk-inject-panel .ip-row {
            display: flex;
            justify-content: space-between;
            opacity: 0;
            animation: hkRowIn 0.3s ease-out forwards;
        }
        .hk-inject-panel .ip-row .ok { color: #5dffb1; text-shadow: 0 0 5px #5dffb1; }

        /* ===== S/M sudo morph stage ===== */
        .hk-sm-stage {
            position: absolute;
            inset: 0;
            z-index: 16;
            pointer-events: none;
            overflow: hidden;
            animation: hkSmStageIn 0.35s ease-out, hkSmStageOut 0.6s 2.5s forwards;
        }
        @keyframes hkSmStageIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes hkSmStageOut {
            from { opacity: 1; }
            to   { opacity: 0; }
        }

        .hk-sm-window {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            min-width: 560px;
            max-width: 70vw;
            background: rgba(0,18,8,0.85);
            border: 1px solid var(--text-color);
            box-shadow:
                0 0 20px rgba(0,255,65,0.55),
                inset 0 0 28px rgba(0,255,65,0.10);
            font-family: var(--font-main);
            color: var(--text-color);
            font-size: 1em;
            padding: 0.45em 0.85em 0.7em;
            z-index: 17;
            animation: hkPanelPop 0.35s ease-out;
        }
        .hk-sm-window .hk-title {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            letter-spacing: 2px;
            border-bottom: 1px dashed rgba(0,255,65,0.45);
            padding: 0.05em 0 0.4em;
            margin-bottom: 0.4em;
        }
        .hk-sm-line { line-height: 1.5em; opacity: 0; animation: hkRowIn 0.3s ease-out forwards; }
        .hk-sm-line .prompt { opacity: 0.55; }
        .hk-sm-line.ok  { color: #5dffb1; text-shadow: 0 0 5px #5dffb1; }
        .hk-sm-line.err { color: var(--love-color); text-shadow: 0 0 5px var(--love-color); }
        .hk-sm-progress-wrap {
            display: flex; align-items: center; gap: 0.5em;
            line-height: 1.5em;
            opacity: 0;
            animation: hkRowIn 0.3s ease-out forwards;
        }
        .hk-sm-progress-bar {
            flex: 1;
            height: 12px;
            background: rgba(0,255,65,0.12);
            border: 1px solid var(--text-color);
            position: relative;
            overflow: hidden;
        }
        .hk-sm-progress-bar::after {
            content: '';
            position: absolute; top: 0; left: 0; bottom: 0;
            width: 0%;
            background: linear-gradient(90deg, var(--text-color), var(--highlight-color));
            box-shadow: 0 0 8px var(--text-color);
            animation: hkSmProg 1.0s 0.55s ease-out forwards;
        }
        @keyframes hkSmProg { to { width: 100%; } }

        /* huge ASCII letters S / M */
        .hk-sm-letter {
            position: absolute;
            top: 30%;
            transform: translate(-50%, -50%);
            font-family: var(--font-main);
            font-size: 2.0em;
            line-height: 1em;
            white-space: pre;
            letter-spacing: 0;
            z-index: 18;
            opacity: 0;
            text-align: center;
            font-weight: bold;
        }
        .hk-sm-letter.s {
            left: 18%;
            color: #ff3b6b;
            text-shadow: 0 0 10px #ff3b6b, 0 0 22px rgba(255,59,107,0.55);
            animation:
                hkSmIn 0.5s 0.05s ease-out forwards,
                hkSmGlitch 0.18s 0.6s steps(2) 6,
                hkSmFade 0.6s 2.4s ease-in forwards;
        }
        .hk-sm-letter.m {
            left: 82%;
            color: #b066ff;
            text-shadow: 0 0 10px #b066ff, 0 0 22px rgba(176,102,255,0.55);
            animation:
                hkSmIn 0.5s 1.05s ease-out forwards,
                hkSmGlitch 0.18s 1.6s steps(2) 6,
                hkSmFade 0.6s 2.4s ease-in forwards;
        }
        @keyframes hkSmIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.4); filter: blur(8px); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }
        @keyframes hkSmGlitch {
            0%   { transform: translate(-50%, -50%) translateX(0); }
            25%  { transform: translate(-50%, -50%) translateX(-3px) skewX(2deg); filter: drop-shadow(2px 0 0 #00ffff); }
            50%  { transform: translate(-50%, -50%) translateX(3px) skewX(-2deg); filter: drop-shadow(-2px 0 0 #ff007f); }
            100% { transform: translate(-50%, -50%) translateX(0); }
        }
        @keyframes hkSmFade {
            from { opacity: 1; }
            to   { opacity: 0; }
        }

        /* network packet flow between S and M */
        .hk-sm-packet {
            position: absolute;
            top: 50%;
            font-family: var(--font-main);
            font-size: 1em;
            color: var(--love-color);
            text-shadow: 0 0 6px var(--love-color);
            opacity: 0;
            transform: translate(-50%, -50%);
            animation: hkPacketFlow 1.4s linear forwards;
            z-index: 17;
            white-space: nowrap;
        }
        @keyframes hkPacketFlow {
            0%   { left: 22%; opacity: 0; }
            12%  { opacity: 1; }
            85%  { opacity: 1; }
            100% { left: 78%; opacity: 0; }
        }

        /* corner ascii fixtures around S/M */
        .hk-sm-corner {
            position: absolute;
            font-family: var(--font-main);
            font-size: 0.85em;
            color: rgba(0,255,65,0.55);
            opacity: 0;
            animation: hkRowIn 0.4s 0.2s forwards;
            z-index: 16;
            white-space: pre;
            line-height: 1.05em;
        }
        .hk-sm-corner.tl { top: 6%; left: 4%; text-align: left; }
        .hk-sm-corner.tr { top: 6%; right: 4%; text-align: right; }
        .hk-sm-corner.bl { bottom: 6%; left: 4%; text-align: left; color: rgba(255,105,180,0.55); }
        .hk-sm-corner.br { bottom: 6%; right: 4%; text-align: right; color: rgba(176,102,255,0.65); }

        /* ============================================================
           V3 ADDITIONS — FROM→TO panel, sunclock, code-flash, icon cards
           ============================================================ */

        /* ---- generic FROM → TO transformation panel ---- */
        .hk-ft-stage {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: grid;
            grid-template-columns: 1fr 110px 1fr;
            align-items: center;
            gap: 16px;
            min-width: 600px;
            max-width: 78vw;
            padding: 14px 22px 16px;
            background: rgba(0, 14, 6, 0.97);
            border: 1px solid var(--text-color);
            box-shadow: 0 0 24px rgba(0,255,65,0.55), inset 0 0 18px rgba(0,255,65,0.10);
            font-family: var(--font-main);
            color: var(--text-color);
            z-index: 30;
            pointer-events: none;
            overflow: hidden;
            animation: hkPanelPop 0.35s ease-out, hkFtFade 0.5s 1.9s forwards;
        }
        @keyframes hkFtFade { to { opacity: 0; transform: translate(-50%, -50%) scale(0.97); } }

        .hk-ft-stage .ft-title {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            font-size: 0.78em;
            letter-spacing: 2px;
            opacity: 0.85;
            border-bottom: 1px dashed rgba(0,255,65,0.35);
            padding-bottom: 4px;
            margin-bottom: 6px;
        }
        .hk-ft-stage .ft-title .blip { color: var(--love-color); animation: blink 0.9s step-end infinite; }
        .hk-ft-stage .ft-side {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 110px;
        }
        .hk-ft-stage .ft-side .ft-tag {
            font-size: 0.75em;
            letter-spacing: 3px;
            opacity: 0.75;
        }
        .hk-ft-stage .ft-side .ft-label {
            font-family: var(--font-display);
            font-size: 2.6em;
            line-height: 1em;
            letter-spacing: 4px;
        }
        .hk-ft-stage .ft-from .ft-tag { color: rgba(255,105,180,0.85); text-shadow: 0 0 5px rgba(255,105,180,0.6); }
        .hk-ft-stage .ft-from .ft-label {
            color: rgba(255,105,180,0.95);
            text-shadow: 0 0 8px rgba(255,105,180,0.7);
            position: relative;
            opacity: 0;
            animation:
                hkFtFromIn 0.4s 0.05s ease-out forwards,
                hkFtStrike 0.35s 1.05s forwards;
        }
        .hk-ft-stage .ft-from .ft-label::after {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 50%;
            height: 3px;
            background: rgba(255,105,180,0.9);
            box-shadow: 0 0 6px rgba(255,105,180,0.9);
            transform: scaleX(0);
            transform-origin: left;
            animation: hkFtStrikeBar 0.35s 1.05s forwards;
        }
        @keyframes hkFtFromIn {
            from { opacity: 0; transform: translateX(-18px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes hkFtStrike {
            to { color: rgba(255,105,180,0.4); text-shadow: none; filter: blur(0.5px); }
        }
        @keyframes hkFtStrikeBar { to { transform: scaleX(1); } }

        .hk-ft-stage .ft-to .ft-tag { color: var(--text-color); text-shadow: 0 0 5px var(--text-color); }
        .hk-ft-stage .ft-to .ft-label {
            color: var(--highlight-color);
            text-shadow: 0 0 12px var(--highlight-color), 0 0 28px rgba(255,255,255,0.55);
            opacity: 0;
            animation:
                hkFtToIn 0.45s 1.15s ease-out forwards,
                hkFtToPulse 0.6s 1.6s ease-in-out 1;
        }
        @keyframes hkFtToIn {
            from { opacity: 0; transform: translateX(18px) scale(0.85); filter: blur(6px); }
            to   { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
        }
        @keyframes hkFtToPulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.08); }
        }
        .hk-ft-stage .ft-arrow {
            position: relative;
            text-align: center;
            font-family: var(--font-main);
            font-size: 1.4em;
            color: var(--text-color);
            opacity: 0;
            animation: hkFtArrowIn 0.4s 0.6s ease-out forwards;
        }
        .hk-ft-stage .ft-arrow .head {
            display: inline-block;
            text-shadow: 0 0 10px var(--text-color);
            animation: hkFtArrowFlow 0.9s 0.6s linear infinite;
        }
        .hk-ft-stage .ft-arrow .ax {
            display: block;
            font-size: 0.6em;
            opacity: 0.7;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        @keyframes hkFtArrowIn {
            from { opacity: 0; transform: translateX(-15px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes hkFtArrowFlow {
            0%   { transform: translateX(-6px); opacity: 0.5; }
            50%  { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(6px); opacity: 0.5; }
        }
        .hk-ft-stage .ft-foot {
            grid-column: 1 / -1;
            border-top: 1px dashed rgba(0,255,65,0.35);
            padding-top: 4px;
            margin-top: 6px;
            font-size: 0.78em;
            display: flex;
            justify-content: space-between;
            opacity: 0.82;
        }
        .hk-ft-stage .ft-foot .ok { color: #5dffb1; text-shadow: 0 0 5px #5dffb1; }

        .hk-ft-vis {
            width: 100%;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* AC sine glyph */
        .vis-ac {
            width: 90px; height: 30px;
            color: rgba(255,105,180,0.95);
            filter: drop-shadow(0 0 6px rgba(255,105,180,0.7));
        }
        /* DC straight bar */
        .vis-dc {
            width: 90px; height: 30px;
            position: relative;
        }
        .vis-dc::before {
            content: '';
            position: absolute; left: 0; right: 0; top: 50%;
            height: 3px;
            background: var(--highlight-color);
            box-shadow: 0 0 10px var(--highlight-color);
            transform: translateY(-50%);
        }
        .vis-dc::after {
            content: '';
            position: absolute; left: 0; right: 0; top: 50%;
            height: 3px;
            background: rgba(255,255,255,0.25);
            transform: translateY(-50%) translateY(-9px);
        }
        /* AD/BC arrows */
        .vis-arrow {
            font-family: var(--font-main);
            font-size: 1.2em;
            letter-spacing: 2px;
        }
        .vis-arrow.fwd { color: rgba(255,105,180,0.95); text-shadow: 0 0 6px rgba(255,105,180,0.9); }
        .vis-arrow.bwd { color: var(--highlight-color); text-shadow: 0 0 8px var(--highlight-color); }
        /* F/M gender symbols */
        .vis-symbol {
            font-size: 2em;
            font-family: var(--font-display);
            line-height: 1;
        }
        .vis-symbol.f { color: rgba(255,105,180,0.95); text-shadow: 0 0 8px rgba(255,105,180,0.7); }
        .vis-symbol.m { color: var(--highlight-color); text-shadow: 0 0 10px var(--highlight-color); }

        /* ---- AM → PM sunclock ---- */
        .hk-sun-stage {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 660px;
            max-width: 80vw;
            padding: 12px 18px 14px;
            background: rgba(0, 14, 6, 0.96);
            border: 1px solid var(--text-color);
            box-shadow: 0 0 24px rgba(0,255,65,0.55);
            color: var(--text-color);
            font-family: var(--font-main);
            z-index: 30;
            pointer-events: none;
            animation: hkPanelPop 0.35s ease-out, hkFtFade 0.5s 2.4s forwards;
        }
        .hk-sun-stage .sun-title {
            display: flex;
            justify-content: space-between;
            font-size: 0.8em;
            letter-spacing: 2px;
            border-bottom: 1px dashed rgba(0,255,65,0.35);
            padding-bottom: 4px;
            margin-bottom: 8px;
        }
        .hk-sun-stage .sun-title .blip { color: var(--love-color); animation: blink 0.9s step-end infinite; }
        .hk-sun-canvas {
            position: relative;
            height: 130px;
            width: 100%;
            background: linear-gradient(to bottom,
                rgba(255, 200, 175, 0.18) 0%,
                rgba(255, 220, 195, 0.10) 35%,
                rgba(180, 175, 215, 0.08) 70%,
                rgba(0, 0, 0, 0.0) 100%);
            border: 1px solid rgba(0,255,65,0.25);
            overflow: hidden;
            animation: hkSunSky 2.4s ease-in-out forwards;
        }
        /* V6.1: softened pastel sunrise → midday → sunset palette */
        @keyframes hkSunSky {
            0%   { background: linear-gradient(to bottom, rgba(255, 196, 174, 0.22), rgba(255, 218, 190, 0.14), rgba(220, 200, 220, 0.08), rgba(0,0,0,0.0)); }
            45%  { background: linear-gradient(to bottom, rgba(190, 220, 245, 0.18), rgba(255, 248, 232, 0.10), rgba(0,0,0,0.0), rgba(0,0,0,0.0)); }
            100% { background: linear-gradient(to bottom, rgba(180, 160, 210, 0.26), rgba(255, 188, 168, 0.18), rgba(220, 175, 200, 0.12), rgba(0,0,0,0.0)); }
        }
        .hk-sun-canvas .horizon {
            position: absolute;
            left: 0; right: 0;
            bottom: 18%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0,255,65,0.65), transparent);
            box-shadow: 0 0 6px rgba(0,255,65,0.6);
        }
        .hk-sun-canvas .sun {
            position: absolute;
            width: 36px; height: 36px;
            border-radius: 50%;
            background: radial-gradient(circle, #fffbe8 0%, #ffe7a8 35%, #ffb98a 70%, transparent 82%);
            box-shadow: 0 0 22px rgba(255, 200, 150, 0.65), 0 0 48px rgba(255, 195, 165, 0.42);
            offset-path: path('M 0,108 Q 320,-30 640,108');
            offset-distance: 0%;
            animation: hkSunArc 2.4s ease-in-out forwards;
            top: 0; left: 0;
        }
        @keyframes hkSunArc {
            from { offset-distance: 0%; }
            to   { offset-distance: 100%; }
        }
        .hk-sun-canvas .sun-trail {
            position: absolute;
            inset: 0;
            background: none;
        }
        .hk-sun-canvas .sun-trail svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .hk-sun-canvas .sun-trail .trail-path {
            fill: none;
            stroke: rgba(255, 215, 175, 0.45);
            stroke-width: 1.4;
            stroke-dasharray: 4 5;
            filter: drop-shadow(0 0 4px rgba(255, 215, 175, 0.5));
        }
        .hk-sun-stage .sun-marks {
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
            font-size: 0.85em;
            letter-spacing: 2px;
        }
        .hk-sun-stage .sun-marks .from { color: #ffd1a8; text-shadow: 0 0 6px rgba(255,200,150,0.6); }
        .hk-sun-stage .sun-marks .to   { color: #d8b4dc; text-shadow: 0 0 6px rgba(190,160,200,0.6); }
        .hk-sun-stage .sun-marks .now {
            color: var(--text-color);
            text-shadow: 0 0 6px var(--text-color);
            font-family: var(--font-main);
            font-size: 0.85em;
            opacity: 0.9;
        }
        .hk-sun-stage .sun-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85em;
            margin-top: 6px;
            padding-top: 4px;
            border-top: 1px dashed rgba(0,255,65,0.35);
        }
        .hk-sun-stage .sun-row .clock {
            font-family: var(--font-display);
            font-size: 1.6em;
            color: var(--highlight-color);
            text-shadow: 0 0 8px var(--highlight-color);
            letter-spacing: 3px;
        }

        /* ---- code-flash for EXECUTION ---- */
        .hk-code-flash {
            position: absolute;
            background: rgba(0, 8, 4, 0.92);
            border: 1px solid var(--error-color);
            box-shadow: 0 0 18px rgba(255,51,51,0.55);
            font-family: var(--font-main);
            color: var(--error-color);
            text-shadow: 0 0 4px var(--error-color);
            padding: 8px 14px 10px;
            font-size: 0.95em;
            min-width: 280px;
            max-width: min(480px, 70vw);
            box-sizing: border-box;
            overflow: hidden;
            z-index: 18;
            pointer-events: none;
            transform: translate(-50%, -50%);
            animation: hkCodeIn 0.18s ease-out, hkCodeOut 0.35s var(--life, 0.5s) ease-in forwards;
        }
        .hk-code-flash .cf-head {
            display: flex; justify-content: space-between;
            font-size: 0.75em;
            letter-spacing: 2px;
            opacity: 0.75;
            border-bottom: 1px dashed rgba(255,51,51,0.45);
            padding-bottom: 3px;
            margin-bottom: 5px;
        }
        .hk-code-flash .cf-head .blip { color: #ff8e8e; animation: blink 0.6s step-end infinite; }
        .hk-code-flash .cf-line {
            white-space: pre-wrap;
            word-break: break-all;
            overflow: hidden;
            line-height: 1.35em;
            max-height: 3.6em;
        }
        .hk-code-flash .cf-line .prompt { opacity: 0.55; color: var(--error-color); }
        .hk-code-flash .cf-tag {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.72em;
            color: rgba(255,200,200,0.7);
            letter-spacing: 1px;
        }
        @keyframes hkCodeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.92); filter: blur(3px); }
            to   { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }
        @keyframes hkCodeOut {
            from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            to   { opacity: 0; transform: translate(-50%, -50%) scale(0.95); filter: blur(2px); }
        }

        /* dramatic single execution flash on emphasis */
        .hk-exec-hero {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(8, 0, 0, 0.95);
            border: 2px solid var(--error-color);
            box-shadow:
                0 0 24px rgba(255,51,51,0.85),
                inset 0 0 24px rgba(255,51,51,0.18);
            font-family: var(--font-main);
            color: var(--error-color);
            text-shadow: 0 0 6px var(--error-color);
            padding: 14px 22px 16px;
            min-width: 460px;
            max-width: 70vw;
            box-sizing: border-box;
            overflow: hidden;
            z-index: 19;
            pointer-events: none;
            /* V6.1.4: pop-out is now driven by JS so per-call timing varies. */
            animation: hkPanelPop 0.3s ease-out forwards;
        }
        .hk-exec-hero .eh-head {
            display: flex; justify-content: space-between;
            font-size: 0.8em;
            letter-spacing: 3px;
            border-bottom: 1px dashed rgba(255,51,51,0.5);
            padding-bottom: 4px;
            margin-bottom: 8px;
        }
        .hk-exec-hero .eh-head .pulse { color: #ff8e8e; animation: blink 0.5s step-end infinite; }
        .hk-exec-hero .eh-line {
            line-height: 1.5em;
            white-space: pre-wrap;
            word-break: break-word;
            overflow: hidden;
        }
        .hk-exec-hero .eh-tag {
            margin-top: 6px;
            font-size: 0.78em;
            letter-spacing: 1px;
            color: rgba(255,200,200,0.78);
            border-top: 1px dashed rgba(255,51,51,0.5);
            padding-top: 5px;
        }

        /* ---- icon cards (replacing emojis) ---- */
        .hk-icon-card {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            background: rgba(0, 18, 8, 0.7);
            border: 1px solid var(--text-color);
            box-shadow: 0 0 12px rgba(0,255,65,0.4);
            font-family: var(--font-main);
            font-size: 0.8em;
            color: var(--text-color);
            text-shadow: 0 0 4px var(--text-color);
            z-index: 15;
            pointer-events: none;
            animation: hkIconIn 0.45s ease-out, hkIconOut 0.45s 1.55s forwards;
        }
        @keyframes hkIconIn {
            from { opacity: 0; transform: scale(0.5) translateY(20px); filter: blur(4px); }
            to   { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        @keyframes hkIconOut {
            to { opacity: 0; transform: scale(0.85) translateY(-10px); filter: blur(2px); }
        }
        .hk-icon-card svg { display: block; filter: drop-shadow(0 0 6px currentColor); }
        .hk-icon-card .ic-label {
            letter-spacing: 2px;
            font-size: 0.85em;
            opacity: 0.9;
        }
        .hk-icon-card.eggplant { color: #b066ff; border-color: #b066ff; box-shadow: 0 0 12px rgba(176,102,255,0.5); }
        .hk-icon-card.tomato   { color: #ff5470; border-color: #ff5470; box-shadow: 0 0 12px rgba(255,84,112,0.5); }
        .hk-icon-card.cat      { color: #ffb05a; border-color: #ffb05a; box-shadow: 0 0 12px rgba(255,176,90,0.45); }
        .hk-icon-card.god      { color: #ffe85a; border-color: #ffe85a; box-shadow: 0 0 16px rgba(255,232,90,0.7); animation-name: hkIconIn, hkGodHalo; }
        @keyframes hkGodHalo {
            0%, 100% { box-shadow: 0 0 12px rgba(255,232,90,0.5); }
            50%      { box-shadow: 0 0 24px rgba(255,232,90,0.9), 0 0 60px rgba(255,232,90,0.3); }
        }

        /* ============================================================
           V4 — themed FROM/TO panels per scenario + keyword animations
           ============================================================ */

        /* shared positioning for v4 themed stages */
        .v4-stage {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            pointer-events: none;
            font-family: var(--font-main);
            color: var(--text-color);
            animation: hkPanelPop 0.35s ease-out, hkFtFade 0.5s 2.4s forwards;
        }
        .v4-stage .v4-title {
            display: flex; justify-content: space-between;
            font-size: 0.78em;
            letter-spacing: 2px;
            border-bottom: 1px dashed rgba(0,255,65,0.45);
            padding-bottom: 4px;
            margin-bottom: 8px;
            opacity: 0.85;
        }
        .v4-stage .v4-title .blip { color: var(--love-color); animation: blink 0.9s step-end infinite; }

        /* ===== AC → DC : circuit oscilloscope ===== */
        .hk-acdc-stage {
            width: 720px;
            max-width: 80vw;
            padding: 12px 18px 14px;
            background: rgba(0, 12, 6, 0.96);
            border: 1px solid var(--text-color);
            box-shadow: 0 0 24px rgba(0,255,65,0.55);
        }
        .hk-acdc-stage .acdc-row {
            display: grid;
            grid-template-columns: 1fr 100px 1fr;
            gap: 14px;
            align-items: stretch;
            min-height: 150px;
        }
        .hk-acdc-side {
            position: relative;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 0;
            padding: 8px 10px;
            background: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }
        .hk-acdc-side.from {
            border-color: rgba(255,105,180,0.55);
            box-shadow: inset 0 0 12px rgba(255,105,180,0.18);
        }
        .hk-acdc-side.to {
            border-color: var(--text-color);
            box-shadow: inset 0 0 12px rgba(0,255,65,0.20);
        }
        .hk-acdc-side .acdc-tag {
            font-size: 0.72em;
            letter-spacing: 3px;
            opacity: 0.85;
        }
        .hk-acdc-side.from .acdc-tag { color: rgba(255,105,180,0.95); }
        .hk-acdc-side.to .acdc-tag { color: var(--text-color); }
        .hk-acdc-side .acdc-big {
            font-family: var(--font-display);
            font-size: 3.2em;
            line-height: 1em;
            text-align: center;
        }
        .hk-acdc-side.from .acdc-big {
            color: rgba(255,105,180,0.95);
            text-shadow: 0 0 10px rgba(255,105,180,0.7);
            animation: hkFtStrike 0.5s 1.0s forwards;
            position: relative;
        }
        .hk-acdc-side.from .acdc-big::after {
            content: '';
            position: absolute; left: 10%; right: 10%; top: 50%;
            height: 3px; background: rgba(255,105,180,0.9);
            box-shadow: 0 0 6px rgba(255,105,180,0.9);
            transform: scaleX(0); transform-origin: left;
            animation: hkFtStrikeBar 0.4s 1.0s forwards;
        }
        .hk-acdc-side.to .acdc-big {
            color: var(--highlight-color);
            text-shadow: 0 0 12px var(--highlight-color);
            opacity: 0;
            animation: hkFtToIn 0.45s 1.1s forwards, hkFtToPulse 0.6s 1.6s 1;
        }
        .acdc-scope {
            position: relative;
            flex: 1;
            min-height: 60px;
            background:
                linear-gradient(rgba(0,255,65,0.08) 1px, transparent 1px) 0 0 / 100% 25%,
                linear-gradient(90deg, rgba(0,255,65,0.08) 1px, transparent 1px) 0 0 / 12.5% 100%;
            border: 1px solid rgba(0,255,65,0.25);
        }
        .acdc-scope svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .acdc-scope.ac path {
            stroke: rgba(255,105,180,0.95);
            stroke-width: 2.2;
            fill: none;
            filter: drop-shadow(0 0 5px rgba(255,105,180,0.8));
            animation: hkAcWiggle 0.6s linear infinite;
            transform-origin: center;
        }
        @keyframes hkAcWiggle {
            0%, 100% { transform: translateX(0); }
            50%      { transform: translateX(-30px); }
        }
        .acdc-scope.dc line {
            stroke: var(--highlight-color);
            stroke-width: 3;
            filter: drop-shadow(0 0 7px var(--highlight-color));
        }
        .acdc-scope.dc .pulse {
            stroke: var(--text-color);
            stroke-width: 1.5;
            opacity: 0;
            animation: hkDcPulse 1.2s ease-out infinite;
        }
        @keyframes hkDcPulse {
            0%   { opacity: 0; transform: translateX(0); }
            20%  { opacity: 1; }
            100% { opacity: 0; transform: translateX(220px); }
        }
        /* electric arcs for AC */
        .acdc-arc {
            position: absolute;
            font-family: var(--font-main);
            color: rgba(255,180,255,0.85);
            font-size: 0.9em;
            text-shadow: 0 0 8px rgba(255,80,200,0.9);
            animation: hkArcFlash 0.4s ease-out infinite;
        }
        @keyframes hkArcFlash {
            0%, 100% { opacity: 0; }
            50%      { opacity: 1; }
        }
        .acdc-battery {
            display: flex; gap: 4px;
            align-items: center;
            font-size: 0.82em;
        }
        .acdc-battery .cell {
            display: inline-block; width: 12px; height: 18px;
            border: 1.5px solid var(--text-color);
            box-shadow: 0 0 6px var(--text-color);
            background: linear-gradient(to top, rgba(0,255,65,0.55) 0%, rgba(0,255,65,0.55) var(--fill, 100%), transparent var(--fill, 100%));
        }
        .acdc-arrow {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            color: var(--text-color);
            opacity: 0;
            animation: hkFtArrowIn 0.4s 0.6s forwards;
        }
        .acdc-arrow .head {
            text-shadow: 0 0 10px var(--text-color);
            animation: hkFtArrowFlow 0.9s 0.6s linear infinite;
        }
        .acdc-arrow .ax {
            font-size: 0.55em;
            opacity: 0.7;
            margin-top: 4px;
            letter-spacing: 1px;
        }
        .hk-acdc-stage .acdc-foot {
            display: flex; justify-content: space-between;
            font-size: 0.78em;
            border-top: 1px dashed rgba(0,255,65,0.35);
            padding-top: 4px;
            margin-top: 8px;
            opacity: 0.85;
        }
        .hk-acdc-stage .acdc-foot .ok { color: #5dffb1; text-shadow: 0 0 5px #5dffb1; }

        /* ===== AD → BC : timeline / film reel ===== */
        .hk-chrono-stage {
            width: 740px;
            max-width: 82vw;
            padding: 12px 18px 14px;
            background: rgba(0, 12, 6, 0.96);
            border: 1px solid var(--text-color);
            box-shadow: 0 0 24px rgba(0,255,65,0.55);
        }
        .chrono-reel {
            position: relative;
            height: 110px;
            border: 1px solid rgba(0,255,65,0.35);
            background: rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .chrono-reel::before, .chrono-reel::after {
            content: '';
            position: absolute; left: 0; right: 0;
            height: 16px;
            background: repeating-linear-gradient(90deg, rgba(0,255,65,0.5) 0 6px, transparent 6px 18px);
        }
        .chrono-reel::before { top: 0; }
        .chrono-reel::after  { bottom: 0; }
        .chrono-strip {
            position: absolute;
            top: 18px; bottom: 18px;
            left: 0; right: 0;
            display: flex;
            align-items: center;
            gap: 22px;
            white-space: nowrap;
            font-family: var(--font-display);
            font-size: 1.6em;
            color: rgba(0,255,65,0.85);
            text-shadow: 0 0 6px rgba(0,255,65,0.7);
            padding-left: 100%;
            will-change: transform;
            /* V6.1.4: fwd quick→pivot pause→bwd longer for legibility. */
            animation: hkChronoFwd 0.55s linear forwards, hkChronoBwd 0.85s 0.65s linear forwards;
        }
        @keyframes hkChronoFwd {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }
        @keyframes hkChronoBwd {
            from { transform: translateX(-50%); }
            to   { transform: translateX(50%); }
        }
        .chrono-strip .yr { letter-spacing: 2px; }
        .chrono-strip .yr.bc { color: rgba(255,105,180,0.9); text-shadow: 0 0 6px rgba(255,105,180,0.8); }
        .chrono-strip .yr.ad { color: var(--highlight-color); text-shadow: 0 0 6px var(--highlight-color); }
        /* V6.1.4: pivot moment now slams in big, scaled+rotated, then settles —
           clearly punctuates the AD→BC reversal pivot. */
        .chrono-pivot {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%) scale(0.4);
            font-family: var(--font-main);
            font-size: 1.05em;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px var(--love-color), 0 0 18px rgba(255,80,150,0.7);
            background: rgba(60,8,30,0.92);
            border: 2px solid var(--love-color);
            box-shadow: 0 0 22px rgba(255,80,150,0.55);
            padding: 4px 12px;
            opacity: 0;
            white-space: nowrap;
            animation: hkPivotSlam 0.42s 0.45s cubic-bezier(.3,1.6,.4,1) forwards;
            letter-spacing: 3px;
            z-index: 5;
        }
        @keyframes hkPivotSlam {
            0%   { opacity: 0; transform: translate(-50%,-50%) scale(2.2) rotate(-12deg); filter: blur(8px); }
            70%  { opacity: 1; transform: translate(-50%,-50%) scale(0.95) rotate(3deg); filter: blur(0); }
            100% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(0deg); }
        }
        /* V6.1.4: white-pink flash at the pivot moment to underline the reversal. */
        .hk-chrono-stage .chrono-flash {
            position: absolute; inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.95) 0%, rgba(255,105,180,0.55) 28%, transparent 60%);
            opacity: 0;
            animation: chrFlashAnim 0.32s 0.55s ease-out forwards;
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 4;
        }
        @keyframes chrFlashAnim { 0% { opacity: 0; } 38% { opacity: 1; } 100% { opacity: 0; } }
        .chrono-stamps {
            display: flex; justify-content: space-between;
            margin-top: 8px;
            font-family: var(--font-main);
            font-size: 0.82em;
        }
        .chrono-stamps .from { color: rgba(255,105,180,0.95); text-shadow: 0 0 6px rgba(255,105,180,0.7); }
        .chrono-stamps .to   { color: var(--highlight-color); text-shadow: 0 0 6px var(--highlight-color); }
        .chrono-stamps .arrow {
            color: var(--text-color);
            letter-spacing: 4px;
        }
        .chrono-foot {
            display: flex; justify-content: space-between;
            font-size: 0.76em;
            border-top: 1px dashed rgba(0,255,65,0.35);
            padding-top: 4px;
            margin-top: 4px;
            opacity: 0.85;
        }

        /* ===== F → M : DNA helix / identity card flip ===== */
        .hk-dna-stage {
            width: 700px;
            max-width: 80vw;
            padding: 12px 18px 14px;
            background: rgba(0, 12, 6, 0.96);
            border: 1px solid var(--text-color);
            box-shadow: 0 0 24px rgba(0,255,65,0.55);
        }
        .dna-row {
            display: grid;
            grid-template-columns: 1fr 110px 1fr;
            gap: 14px;
            align-items: stretch;
            min-height: 160px;
        }
        .dna-card {
            position: relative;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(0,0,0,0.45);
            padding: 8px 10px 10px;
            display: flex; flex-direction: column;
            gap: 6px;
        }
        .dna-card.from { border-color: rgba(255,105,180,0.55); }
        .dna-card.to   { border-color: var(--highlight-color); box-shadow: 0 0 16px rgba(255,255,255,0.16); }
        .dna-card .id-head {
            display: flex; justify-content: space-between;
            font-size: 0.74em;
            letter-spacing: 2px;
            border-bottom: 1px dashed rgba(255,255,255,0.18);
            padding-bottom: 3px;
        }
        .dna-card.from .id-head { color: rgba(255,105,180,0.85); border-color: rgba(255,105,180,0.35); }
        .dna-card.to .id-head { color: var(--highlight-color); border-color: rgba(255,255,255,0.3); }
        .dna-helix {
            position: relative;
            height: 80px;
            margin: 4px 0 2px;
            overflow: hidden;
        }
        .dna-helix svg { width: 100%; height: 100%; }
        .dna-card.from .dna-helix path { stroke: rgba(255,105,180,0.9); }
        .dna-card.to .dna-helix path { stroke: var(--highlight-color); }
        .dna-helix path { fill: none; stroke-width: 2; filter: drop-shadow(0 0 5px currentColor); }
        .dna-card .id-row {
            display: flex; justify-content: space-between;
            font-size: 0.78em;
            opacity: 0.92;
            letter-spacing: 1px;
        }
        .dna-card .id-row .k { opacity: 0.6; }
        .dna-card.from .id-row .v { color: rgba(255,105,180,0.95); }
        .dna-card.to .id-row .v { color: var(--highlight-color); }
        .dna-arrow {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 1.0em;
            color: var(--text-color);
            opacity: 0;
            animation: hkFtArrowIn 0.4s 0.6s forwards;
        }
        .dna-arrow .head {
            font-size: 1.5em;
            animation: hkFtArrowFlow 0.9s 0.6s linear infinite;
            text-shadow: 0 0 10px var(--text-color);
        }
        .dna-foot {
            display: flex; justify-content: space-between;
            font-size: 0.78em;
            border-top: 1px dashed rgba(0,255,65,0.35);
            padding-top: 4px;
            margin-top: 8px;
        }
        .dna-card.from {
            animation: hkFtFromIn 0.4s 0.05s ease-out forwards, hkFtStrike 0.4s 1.0s forwards;
        }
        .dna-card.to {
            opacity: 0;
            animation: hkFtToIn 0.45s 1.1s forwards;
        }

        /* ============================================================
           KEYWORD EMPHASIS FX
           layered behind/around .emphasis text
           ============================================================ */
        .kfx-layer {
            position: absolute;
            left: 0; right: 0;
            display: flex; justify-content: center;
            pointer-events: none;
            z-index: 11;
        }

        /* PROTECTION — firewall packet inspector */
        .kfx-protection {
            top: 6%;
            height: 280px;
            align-items: flex-start;
            justify-content: center;
            font-family: var(--font-main);
            color: var(--text-color);
        }
        .kfx-protection .pf-frame {
            position: relative;
            width: 460px;
            max-width: 78vw;
            background: rgba(0, 12, 6, 0.92);
            border: 1px solid rgba(0,255,65,0.55);
            box-shadow: 0 0 24px rgba(0,255,65,0.45), inset 0 0 24px rgba(0,255,65,0.08);
            padding: 8px 14px 10px;
            opacity: 0;
            transform: translateY(-8px) scale(0.96);
            animation: hkPfIn 0.35s ease-out forwards;
        }
        @keyframes hkPfIn { to { opacity: 1; transform: translateY(0) scale(1); } }
        .kfx-protection .pf-head {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.78em;
            letter-spacing: 2px;
            color: var(--highlight-color);
            text-shadow: 0 0 6px var(--highlight-color);
            border-bottom: 1px dashed rgba(0,255,65,0.45);
            padding-bottom: 4px; margin-bottom: 6px;
        }
        .kfx-protection .pf-head .pf-shield {
            display: inline-block;
            color: var(--highlight-color);
            animation: hkShieldSpin 1.4s linear infinite;
            transform-origin: center;
            margin-right: 6px;
        }
        @keyframes hkShieldSpin { to { transform: rotate(360deg); } }
        .kfx-protection .pf-status .ok { color: #5dffb1; text-shadow: 0 0 6px #5dffb1; }
        .kfx-protection .pf-log {
            font-size: 0.78em;
            line-height: 1.5em;
            min-height: 8em;
        }
        .kfx-protection .pf-row {
            display: flex; gap: 8px; align-items: baseline;
            opacity: 0;
            transform: translateX(-6px);
            animation: hkPfRow 0.28s forwards;
        }
        @keyframes hkPfRow { to { opacity: 1; transform: translateX(0); } }
        .kfx-protection .pf-row .tag { width: 70px; flex: none; letter-spacing: 1px; font-weight: bold; }
        .kfx-protection .pf-row .proto { width: 42px; flex: none; color: rgba(0,255,65,0.7); }
        .kfx-protection .pf-row .pkt { flex: 1; color: rgba(0,255,65,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kfx-protection .pf-row .stamp { font-size: 0.85em; letter-spacing: 1px; }
        .kfx-protection .pf-row.allow .tag { color: #5dffb1; text-shadow: 0 0 6px #5dffb1; }
        .kfx-protection .pf-row.allow .stamp { color: #5dffb1; }
        .kfx-protection .pf-row.block .tag { color: var(--error-color); text-shadow: 0 0 6px var(--error-color); }
        .kfx-protection .pf-row.block .pkt { color: rgba(255,90,90,0.85); text-decoration: line-through; }
        .kfx-protection .pf-row.block .stamp { color: var(--error-color); }
        .kfx-protection .pf-row.quar .tag { color: #ffcd5c; text-shadow: 0 0 6px #ffcd5c; }
        .kfx-protection .pf-row.quar .pkt { color: rgba(255,205,92,0.8); }
        .kfx-protection .pf-foot {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 6px;
            font-size: 0.74em;
            letter-spacing: 2px;
            border-top: 1px dashed rgba(0,255,65,0.45);
            padding-top: 4px;
            color: rgba(0,255,65,0.85);
        }
        .kfx-protection .pf-foot .lock { color: var(--highlight-color); animation: pulse 1.1s ease-in-out infinite; }
        .kfx-protection .pf-foot .meter {
            display: inline-block; width: 110px; height: 6px;
            border: 1px solid rgba(0,255,65,0.45);
            position: relative; vertical-align: middle;
            margin: 0 8px;
        }
        .kfx-protection .pf-foot .meter::after {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
            background: linear-gradient(90deg, var(--text-color), var(--highlight-color));
            box-shadow: 0 0 6px var(--highlight-color);
            animation: hkPfMeter 1.4s 0.2s ease-out forwards;
        }
        @keyframes hkPfMeter { to { width: 100%; } }
        .kfx-protection .pf-scan {
            position: absolute; left: 0; right: 0; top: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--highlight-color), transparent);
            opacity: 0.85;
            box-shadow: 0 0 8px var(--highlight-color);
            animation: hkPfScan 1.1s linear infinite;
        }
        @keyframes hkPfScan { 0%{ top:0; } 100%{ top:100%; } }

        /* SIMULATION — matrix burst beneath text */
        .kfx-simulation {
            top: 28%;
            height: 60px;
            font-family: var(--font-main);
            color: rgba(0,255,65,0.75);
            font-size: 0.88em;
            letter-spacing: 2px;
            text-shadow: 0 0 6px rgba(0,255,65,0.6);
            opacity: 0;
            animation: hkRowIn 0.4s 0.3s forwards, hkSimGlitch 0.18s 0.7s steps(2) 6;
            display: block; text-align: center;
        }
        @keyframes hkSimGlitch {
            50% { transform: translateX(2px); filter: drop-shadow(2px 0 0 #00ffff); }
        }

        /* LIMITATIONS — red brackets close in */
        .kfx-limitations {
            position: absolute;
            top: 12%;
            left: 0; right: 0;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 11;
        }
        .kfx-limitations .bracket {
            position: absolute;
            top: 0; bottom: 0;
            width: 90px;
            border-top: 4px solid var(--error-color);
            border-bottom: 4px solid var(--error-color);
            box-shadow: 0 0 12px rgba(255,51,51,0.7);
            opacity: 0;
            animation: hkLimitBracket 0.55s 0.25s ease-out forwards;
        }
        .kfx-limitations .bracket.l {
            left: 30%;
            border-left: 4px solid var(--error-color);
            transform: translateX(-100px);
        }
        .kfx-limitations .bracket.r {
            right: 30%;
            border-right: 4px solid var(--error-color);
            transform: translateX(100px);
        }
        @keyframes hkLimitBracket {
            to { opacity: 0.9; transform: translateX(0); }
        }
        .kfx-limitations .bound {
            position: absolute;
            top: -22px;
            color: var(--error-color);
            font-size: 0.85em;
            text-shadow: 0 0 6px var(--error-color);
            opacity: 0;
            animation: hkRowIn 0.4s 0.7s forwards;
            letter-spacing: 2px;
        }
        .kfx-limitations .bound.l { left: 28%; }
        .kfx-limitations .bound.r { right: 28%; }

        /* STIMULATIONS — V6.4: neural simulation cascade.
           6 polygraph-style channels with action-potential spikes scrolling left→right,
           a stylized neuron firing radial pulses + neurotransmitter shower. Replaces
           the bare EQ-tower with a "real" simulation feel. */
        .kfx-stimulations {
            position: absolute;
            inset: 14% 8% 14% 8%;
            font-family: var(--font-main);
            display: grid;
            grid-template-columns: 1fr 380px;
            grid-template-rows: 1fr;
            gap: 24px;
            align-items: stretch;
            color: rgba(255, 200, 230, 0.92);
            opacity: 0;
            animation: hkRowIn 0.32s 0.05s forwards, hkRowOut 0.4s 1.95s forwards;
            pointer-events: none;
        }
        /* left half: 6 polygraph channels */
        .kfx-stimulations .stim-channels {
            position: relative;
            border: 1px solid rgba(176, 102, 255, 0.45);
            background: linear-gradient(180deg, rgba(20, 8, 30, 0.65), rgba(8, 0, 16, 0.85));
            box-shadow: 0 0 16px rgba(176, 102, 255, 0.25), inset 0 0 18px rgba(176, 102, 255, 0.08);
            display: grid;
            grid-template-rows: 22px repeat(6, 1fr) 22px;
            font-size: 0.72em;
            letter-spacing: 1.5px;
            overflow: hidden;
        }
        .kfx-stimulations .stim-channels::before {
            content: '';
            position: absolute; inset: 22px 0 22px 0;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 14px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 24px);
            pointer-events: none;
        }
        .kfx-stimulations .stim-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px;
            color: rgba(176, 102, 255, 0.95);
            text-shadow: 0 0 6px rgba(176, 102, 255, 0.7);
            border-bottom: 1px solid rgba(176, 102, 255, 0.35);
            background: rgba(176, 102, 255, 0.08);
        }
        .kfx-stimulations .stim-head .blip { color: #ffafe0; animation: blink 0.6s step-end infinite; margin-right: 4px; }
        .kfx-stimulations .stim-foot {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px;
            color: rgba(176, 102, 255, 0.7);
            text-shadow: 0 0 4px rgba(176, 102, 255, 0.5);
            border-top: 1px solid rgba(176, 102, 255, 0.35);
            font-size: 0.92em;
        }
        .kfx-stimulations .stim-foot .ok { color: #5dffb1; text-shadow: 0 0 5px rgba(93,255,177,0.6); }
        .kfx-stimulations .stim-channel {
            position: relative;
            display: flex; align-items: center;
            border-bottom: 1px dashed rgba(176, 102, 255, 0.15);
            overflow: hidden;
        }
        .kfx-stimulations .stim-channel:last-child { border-bottom: none; }
        .kfx-stimulations .stim-channel .ch-tag {
            position: relative;
            width: 56px;
            text-align: center;
            color: rgba(255, 200, 230, 0.55);
            font-size: 0.85em;
            background: rgba(176, 102, 255, 0.06);
            padding: 2px 0;
            margin-right: 6px;
        }
        /* spike waveform — uses an SVG that draws a flat line with periodic spikes */
        .kfx-stimulations .stim-channel .ch-track {
            position: relative;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }
        .kfx-stimulations .stim-channel svg.ch-wave {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            display: block;
            animation: stimScroll var(--dur, 1.4s) linear infinite;
        }
        .kfx-stimulations .stim-channel svg.ch-wave path {
            fill: none;
            stroke: rgba(255, 200, 250, 0.85);
            stroke-width: 1.2;
            filter: drop-shadow(0 0 3px rgba(255, 200, 250, 0.6)) drop-shadow(0 0 7px rgba(176, 102, 255, 0.6));
        }
        @keyframes stimScroll {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }
        /* sync flash — vertical line that pulses across all channels in unison */
        .kfx-stimulations .stim-sync {
            position: absolute;
            top: 22px; bottom: 22px;
            width: 2px;
            background: linear-gradient(180deg, rgba(255,200,250,0.0) 0%, rgba(255,200,250,0.95) 50%, rgba(255,200,250,0.0) 100%);
            box-shadow: 0 0 10px rgba(255, 180, 240, 0.85), 0 0 22px rgba(176, 102, 255, 0.7);
            opacity: 0;
            animation: stimSync 0.55s ease-out infinite;
        }
        @keyframes stimSync {
            0%   { left: 8%;  opacity: 0; }
            10%  { opacity: 1; }
            100% { left: 95%; opacity: 0; }
        }
        /* right half: stylized neuron + stat readouts */
        .kfx-stimulations .stim-neuron {
            position: relative;
            border: 1px solid rgba(176, 102, 255, 0.45);
            background: radial-gradient(ellipse at 50% 38%, rgba(80, 30, 130, 0.45) 0%, rgba(8, 0, 16, 0.85) 60%);
            box-shadow: 0 0 16px rgba(176, 102, 255, 0.25), inset 0 0 22px rgba(176, 102, 255, 0.10);
            display: flex; flex-direction: column;
        }
        .kfx-stimulations .stim-neuron .nh {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; height: 22px;
            color: rgba(176, 102, 255, 0.95);
            text-shadow: 0 0 6px rgba(176, 102, 255, 0.7);
            font-size: 0.72em;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(176, 102, 255, 0.35);
            background: rgba(176, 102, 255, 0.08);
        }
        .kfx-stimulations .stim-neuron .nh .blip { color: #ffafe0; animation: blink 0.5s step-end infinite; }
        .kfx-stimulations .stim-neuron .nbody {
            position: relative;
            flex: 1;
            min-height: 0;
        }
        /* the neuron itself — soma + dendrites + axon as SVG */
        .kfx-stimulations .stim-neuron svg.nrn {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
        }
        .kfx-stimulations .stim-neuron svg.nrn .soma {
            fill: rgba(255, 180, 230, 0.18);
            stroke: rgba(255, 180, 230, 0.95);
            stroke-width: 1.4;
            filter: drop-shadow(0 0 6px rgba(255, 180, 230, 0.7));
            animation: nrnSomaPulse 0.46s ease-in-out infinite alternate;
        }
        @keyframes nrnSomaPulse {
            from { fill: rgba(255, 180, 230, 0.16); filter: drop-shadow(0 0 6px rgba(255, 180, 230, 0.5)); }
            to   { fill: rgba(255, 180, 230, 0.45); filter: drop-shadow(0 0 14px rgba(255, 180, 230, 0.95)); }
        }
        .kfx-stimulations .stim-neuron svg.nrn .dendrite,
        .kfx-stimulations .stim-neuron svg.nrn .axon {
            fill: none;
            stroke: rgba(255, 180, 230, 0.65);
            stroke-width: 1.3;
            filter: drop-shadow(0 0 3px rgba(255, 180, 230, 0.6));
        }
        .kfx-stimulations .stim-neuron svg.nrn .axon { stroke: rgba(255, 180, 230, 0.9); }
        /* radial pulses traveling out along axon */
        .kfx-stimulations .stim-neuron .pulse-ring {
            position: absolute;
            left: 50%; top: 38%;
            width: 26px; height: 26px;
            border: 2px solid rgba(255, 180, 230, 0.95);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            box-shadow: 0 0 12px rgba(255, 180, 230, 0.7);
            animation: nrnPulse 1.0s ease-out infinite;
        }
        .kfx-stimulations .stim-neuron .pulse-ring.r2 { animation-delay: 0.34s; border-color: rgba(176, 102, 255, 0.85); }
        .kfx-stimulations .stim-neuron .pulse-ring.r3 { animation-delay: 0.66s; border-color: rgba(255, 220, 240, 0.55); }
        @keyframes nrnPulse {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.2); }
            18%  { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(3.6); }
        }
        /* neurotransmitter dots scattering downward like a release */
        .kfx-stimulations .stim-neuron .nt {
            position: absolute;
            width: 5px; height: 5px;
            background: radial-gradient(circle, #ffd6ee 0%, #ff8fc9 60%, transparent 100%);
            border-radius: 50%;
            opacity: 0;
            animation: ntFall var(--ntdur, 1.4s) ease-out infinite;
            animation-delay: var(--ntd, 0s);
        }
        @keyframes ntFall {
            0%   { opacity: 0; transform: translate(0, 0) scale(0.6); }
            10%  { opacity: 1; }
            100% { opacity: 0; transform: translate(var(--ntx, 0px), var(--nty, 60px)) scale(0.4); }
        }
        /* stat readouts at bottom of neuron panel */
        .kfx-stimulations .stim-neuron .nstats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px 10px;
            padding: 6px 10px 8px;
            font-size: 0.72em;
            letter-spacing: 1px;
            border-top: 1px solid rgba(176, 102, 255, 0.35);
        }
        .kfx-stimulations .stim-neuron .nstats .row {
            display: flex; justify-content: space-between;
            color: rgba(255, 200, 230, 0.7);
        }
        .kfx-stimulations .stim-neuron .nstats .row .val {
            color: #ffafe0;
            text-shadow: 0 0 5px rgba(255, 175, 224, 0.7);
            font-weight: bold;
        }

        /* SATISFACTION — dual gauges + dopamine particles */
        .kfx-satisfaction {
            top: 26%;
            height: 140px;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            font-family: var(--font-main);
        }
        .kfx-satisfaction .sat-card {
            width: 360px;
            max-width: 70vw;
            background: rgba(0,12,6,0.92);
            border: 1px solid rgba(0,255,65,0.55);
            box-shadow: 0 0 18px rgba(0,255,65,0.4), inset 0 0 16px rgba(0,255,65,0.06);
            padding: 6px 12px 10px;
            opacity: 0;
            transform: translateY(-6px);
            animation: hkPfIn 0.3s 0.05s forwards;
        }
        .kfx-satisfaction .sat-head {
            display: flex; justify-content: space-between; font-size: 0.78em; letter-spacing: 2px;
            color: var(--highlight-color);
            text-shadow: 0 0 6px var(--highlight-color);
            border-bottom: 1px dashed rgba(0,255,65,0.45);
            padding-bottom: 3px; margin-bottom: 6px;
        }
        .kfx-satisfaction .sat-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.8em;
            margin: 4px 0;
        }
        .kfx-satisfaction .sat-row .lbl { width: 110px; color: rgba(0,255,65,0.75); letter-spacing: 1px; flex: none; }
        .kfx-satisfaction .sat-row .gauge {
            position: relative; flex: 1; height: 12px;
            border: 1px solid var(--text-color);
            background: rgba(0,255,65,0.08);
            box-shadow: 0 0 8px rgba(0,255,65,0.3);
        }
        .kfx-satisfaction .sat-row .gauge::after {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
            background: linear-gradient(90deg, var(--text-color), var(--highlight-color), var(--love-color));
            box-shadow: 0 0 8px var(--highlight-color);
            animation: hkGaugeFill 0.9s var(--d, 0.2s) ease-out forwards;
        }
        .kfx-satisfaction .sat-row .pct {
            width: 50px; text-align: right; flex: none;
            color: var(--love-color);
            text-shadow: 0 0 6px var(--love-color);
            font-weight: bold;
            opacity: 0;
            animation: hkRowIn 0.3s var(--p, 1s) forwards;
        }
        .kfx-satisfaction .sat-foot {
            display: flex; justify-content: space-between;
            margin-top: 6px;
            font-size: 0.78em; letter-spacing: 2px;
            color: var(--highlight-color);
            text-shadow: 0 0 6px var(--highlight-color);
            opacity: 0;
            animation: hkRowIn 0.3s 1.2s forwards;
        }
        .kfx-satisfaction .sat-foot .stamp {
            color: var(--love-color);
            text-shadow: 0 0 8px var(--love-color);
            border: 1px solid var(--love-color);
            padding: 1px 6px;
            animation: blink 0.5s step-end infinite;
        }
        @keyframes hkGaugeFill { to { width: var(--w, 100%); } }

        /* EXECUTION (per-emphasis) — kernel call dump */
        .kfx-execution {
            top: 22%;
            height: 200px;
            font-family: var(--font-main);
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .kfx-execution .ex-pid {
            display: inline-block;
            font-size: 0.82em;
            color: var(--text-color);
            background: rgba(0,255,65,0.06);
            border: 1px solid rgba(0,255,65,0.45);
            padding: 2px 8px;
            letter-spacing: 1px;
            opacity: 0;
            transform: translate(var(--dx, 0px), -8px);
            animation: hkExPidIn 0.28s forwards, hkExPidOut 0.4s 1.2s forwards;
        }
        @keyframes hkExPidIn  { to { opacity: 1; transform: translate(var(--dx, 0px), 0); } }
        @keyframes hkExPidOut { to { opacity: 0; filter: blur(3px); transform: translate(var(--dx, 0px), 4px); } }
        .kfx-execution .ex-pid.kill { color: var(--error-color); border-color: var(--error-color); text-shadow: 0 0 6px var(--error-color); }
        .kfx-execution .ex-pid.spawn { color: var(--love-color); border-color: var(--love-color); text-shadow: 0 0 6px var(--love-color); }
        .kfx-execution .ex-pid.fork { color: var(--highlight-color); border-color: var(--highlight-color); text-shadow: 0 0 6px var(--highlight-color); }
        .kfx-execution .ex-stamp {
            font-size: 0.78em;
            letter-spacing: 3px;
            color: var(--error-color);
            text-shadow: 0 0 8px var(--error-color);
            opacity: 0;
            animation: hkRowIn 0.3s 0.85s forwards, blink 0.32s step-end 0.85s 6;
        }

        /* COMPLETION — progress bar to 100% with checkmark */
        .kfx-completion {
            top: 35%;
            height: 50px;
        }
        .kfx-completion .bar-wrap {
            display: flex; align-items: center; gap: 10px;
        }
        .kfx-completion .bar {
            width: 280px; height: 14px;
            border: 1px solid var(--text-color);
            position: relative;
            background: rgba(0,255,65,0.10);
        }
        .kfx-completion .bar::after {
            content: '';
            position: absolute; top: 0; left: 0; bottom: 0;
            width: 0%;
            background: var(--text-color);
            box-shadow: 0 0 10px var(--text-color);
            animation: hkGaugeFill 1.0s 0.2s ease-out forwards;
        }
        .kfx-completion .check {
            font-size: 1.4em;
            color: #5dffb1;
            text-shadow: 0 0 8px #5dffb1;
            opacity: 0;
            animation: hkCheckIn 0.4s 1.25s forwards;
        }
        @keyframes hkCheckIn {
            from { opacity: 0; transform: scale(0.4) rotate(-20deg); }
            to   { opacity: 1; transform: scale(1) rotate(0); }
        }

        /* V6.1 ISOLATION — clearer narrative:
            (0-0.25s)   five large "[you]" tags appear at fixed positions around center
            (0.25-0.60s) each [you] LEAVES with a clear directional drift + "× LEFT" tag
            (0.55-0.95s) vignette closes in fast; "[ ME ]" emerges center, big & lonely
           Window: ~0.95s. Reading order is sequential and obvious. */
        /* V6.1.4: ISOLATION redesigned to convey "you have LEFT me" narrative.
           Phase 1 (0-0.25s): [you] ←link→ [me] paired at center, BOND status.
           Phase 2 (0.25-0.55s): link snaps (red crack), [you] slides offscreen left.
           Phase 3 (0.55-0.95s): vignette closes around lone [me], "left in ISOLATION"
                                 stamp glows beneath. */
        .kfx-isolation {
            position: fixed;
            inset: 0;
            z-index: 9;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, transparent 85%, rgba(0,0,0,0.0) 100%);
            /* V6.1.5: vignette slowed 0.55s/0.45s → 0.85s/0.70s for the
               extended isolation window (showIsolation moved 117.0→116.40,
               giving 1.55s before next clearScreen). */
            animation: kfxIsolateVignette 0.85s 0.70s cubic-bezier(.4,0,.4,1) forwards;
        }
        @keyframes kfxIsolateVignette {
            0%   { background: radial-gradient(circle at 50% 50%, transparent 85%, rgba(0,0,0,0.0) 100%); }
            55%  { background: radial-gradient(circle at 50% 50%, transparent 22%, rgba(0,0,0,0.85) 55%); }
            100% { background: radial-gradient(circle at 50% 50%, transparent 11%, rgba(0,0,0,0.99) 28%); }
        }
        /* paired view: [you] and [me] side by side, connected */
        .kfx-isolation .iso-pair {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: var(--font-main);
            font-size: 1.4em;
            font-weight: bold;
            white-space: nowrap;
            letter-spacing: 2px;
        }
        /* the [you] label — fades in, then slides offscreen left, breaking the bond */
        .kfx-isolation .iso-you-tag {
            color: #ff8fc9;
            text-shadow: 0 0 10px rgba(255,140,200,0.95);
            opacity: 0;
            /* V6.1.5: 0.95s → 1.50s — give viewer time to read [you] before
               it slides offscreen */
            animation: kfxIsoYouLeave 1.50s ease-in forwards;
        }
        @keyframes kfxIsoYouLeave {
            0%   { opacity: 0; transform: translateX(20px); filter: blur(3px); }
            15%  { opacity: 1; transform: translateX(0);    filter: blur(0); }
            32%  { opacity: 1; transform: translateX(0); }
            55%  { opacity: 0.85; transform: translateX(-60px) scale(0.95); filter: blur(0); }
            100% { opacity: 0; transform: translateX(-440px) scale(0.6); filter: blur(8px); }
        }
        /* the connecting bond — green link, then snaps red, then dissolves */
        .kfx-isolation .iso-link {
            position: relative;
            width: 110px;
            height: 4px;
            background: linear-gradient(90deg, rgba(150,255,180,0.85) 0%, rgba(255,140,200,0.85) 100%);
            box-shadow: 0 0 8px rgba(150,255,180,0.7), 0 0 14px rgba(255,140,200,0.5);
            border-radius: 2px;
            opacity: 0;
            /* V6.1.5: 0.95s → 1.50s — match slowed [you] departure */
            animation: kfxIsoLinkSnap 1.50s ease-in forwards;
        }
        .kfx-isolation .iso-link::before {
            content: '×';
            position: absolute;
            left: 50%; top: -16px;
            transform: translate(-50%, 0) scale(0);
            color: #ff5252;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,80,80,0.95), 0 0 20px rgba(255,80,80,0.6);
            opacity: 0;
            /* V6.1.5: 0.7s/0.30s → 1.10s/0.48s, scaled with parent timing */
            animation: kfxIsoCross 1.10s 0.48s cubic-bezier(.3,1.6,.4,1) forwards;
        }
        @keyframes kfxIsoLinkSnap {
            0%   { opacity: 0; transform: scaleX(0); }
            18%  { opacity: 1; transform: scaleX(1); }
            32%  { opacity: 1; transform: scaleX(1); }
            38%  { opacity: 1; transform: scaleX(1.05); background: linear-gradient(90deg, #ff5252 0%, #ff5252 100%); }
            55%  { opacity: 0.6; transform: scaleX(0.6); filter: blur(2px); }
            100% { opacity: 0; transform: scaleX(0); }
        }
        @keyframes kfxIsoCross {
            0%   { opacity: 0; transform: translate(-50%, 0) scale(0) rotate(-30deg); }
            45%  { opacity: 1; transform: translate(-50%, 0) scale(1.4) rotate(8deg); }
            70%  { opacity: 1; transform: translate(-50%, 0) scale(1.0) rotate(0); }
            100% { opacity: 0; transform: translate(-50%, 0) scale(0.85) rotate(0); filter: blur(4px); }
        }
        /* the [me] label — initially paired, then alone & flickering */
        .kfx-isolation .iso-me-tag {
            color: #ffe9f0;
            text-shadow: 0 0 10px rgba(255,140,180,0.95), 0 0 20px rgba(255,80,120,0.55);
            opacity: 0;
            /* V6.1.5: 0.95s → 1.50s */
            animation: kfxIsoMeAlone 1.50s ease-out forwards;
        }
        @keyframes kfxIsoMeAlone {
            0%   { opacity: 0; transform: translateX(-20px); filter: blur(3px); }
            15%  { opacity: 1; transform: translateX(0);    filter: blur(0); }
            55%  { opacity: 1; transform: translateX(0); text-shadow: 0 0 14px rgba(255,140,180,0.95); }
            70%  { opacity: 0.55; transform: translateX(0); filter: brightness(0.7); }
            85%  { opacity: 0.9; transform: translateX(0); filter: brightness(1.2); }
            100% { opacity: 0.9; transform: translateX(0); filter: brightness(1); }
        }
        /* "left in :: ISOLATION" stamp beneath the lone [me] */
        .kfx-isolation .iso-stamp {
            position: absolute;
            left: 50%; top: calc(50% + 36px);
            transform: translate(-50%, 0) scale(0.85);
            font-family: var(--font-main);
            font-size: 0.78em;
            color: rgba(255, 200, 220, 0.78);
            letter-spacing: 5px;
            white-space: nowrap;
            border: 1px dashed rgba(255,140,180,0.5);
            padding: 3px 12px;
            background: rgba(20,0,15,0.5);
            opacity: 0;
            /* V6.1.5: delay 0.60s → 0.95s so the stamp lands after the slowed
               link-snap, and lasts longer in view */
            animation: kfxIsoStamp 0.55s 0.95s ease-out forwards;
        }
        @keyframes kfxIsoStamp {
            0%   { opacity: 0; transform: translate(-50%, 0) scale(0.7); filter: blur(4px); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0); }
        }
        /* dashed ring closing in around lone [me] */
        .kfx-isolation .iso-ring {
            position: absolute;
            left: 50%; top: 50%;
            width: 240px; height: 240px;
            border: 2px dashed rgba(255,140,180,0.55);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            box-shadow: 0 0 22px rgba(255,140,180,0.25);
            /* V6.1.5: 0.55s/0.55s → 0.85s/0.85s — ring closes on the slowed
               schedule */
            animation: kfxIsoRing 0.85s 0.85s cubic-bezier(.3,.6,.4,1) forwards;
        }
        @keyframes kfxIsoRing {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(2.2) rotate(0); }
            55%  { opacity: 0.7; transform: translate(-50%, -50%) scale(1.05) rotate(45deg); }
            100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1.0) rotate(60deg); }
        }

        /* V6.1.5: pointless system-wide data-erase. Replaces the cold
           clearScreenAndShapes that used to wipe the prior screen instantly
           when "If I can erase all the pointless" begins. Now the wipe IS
           the visual — every prior line/shape gets struck through and
           dissolved into ash while a top-corner PURGE log ticks files off,
           peaking right when FRAGMENTS keyword fires its central shard
           explosion 2.55s later. */
        .pointless-wipe-log {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 290px;
            background: rgba(8, 0, 6, 0.92);
            border: 1px solid #ff6e91;
            color: #ffd0e0;
            font-family: var(--font-main);
            font-size: 11px;
