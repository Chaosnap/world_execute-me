                <div class="pa-hint">press <kbd>P</kbd> to resume · <kbd>[</kbd><kbd>]</kbd> lyric ±50ms · <kbd>\\</kbd> offset reset · <kbd>N</kbd> note · <kbd>L</kbd> list · <kbd>E</kbd> export · <kbd>B</kbd> tap beat · <kbd>K</kbd> beats · <kbd>1/7/5/3</kbd> speed</div>
            `;
            document.body.appendChild(el);
            return el;
        }
        function togglePause() {
            // ignore until experience has started (overlay still visible)
            if (!overlay.classList.contains('hidden')) return;
            _paused = !_paused;
            const pe = _ensurePauseOverlay();
            if (_paused) {
                try { song.pause(); } catch (e) {}
                document.body.classList.add('paused');
                _ambRainPaused = true;
                // pause every active typing setInterval — store and clear
                _pausedTypingTimers = _activeTypingTimers.slice();
                _activeTypingTimers.forEach(t => {
                    clearInterval(t.id);
                    t.paused = true;
                });
                _updatePauseHintRate(song.playbackRate || 1);
                pe.classList.add('show');
            } else {
                document.body.classList.remove('paused');
                _ambRainPaused = false;
                pe.classList.remove('show');
                // resume typing — recreate intervals from saved state
                _pausedTypingTimers.forEach(t => {
                    if (t && t.resume) t.resume();
                });
                _pausedTypingTimers = [];
                // re-assert rate (some browsers reset it on pause/play)
                const r = song.playbackRate || 1;
                song.play().then(() => { song.playbackRate = r; }).catch(() => {});
            }
        }
        // ===== V6.1: Annotation system =====
        // Lets the user pin notes to specific song moments while watching.
        // Hotkeys (when annotation modal is closed):
        //   N — open note dialog (auto-pauses)
        //   E — export all notes as a JSON file download
        //   L — toggle list of saved notes
        //   Shift+X — clear all notes (with confirm)
        // Storage: localStorage['lyric_notes_v61'] — JSON array of
        //   { id, ts (ms epoch), songTime (s), lyricText, lyricFn, lyricTime, note }
        const NOTE_STORAGE_KEY = 'lyric_notes_v61';
        function _loadNotes() {
            try { return JSON.parse(localStorage.getItem(NOTE_STORAGE_KEY) || '[]'); }
            catch (e) { return []; }
        }
        function _saveNotes(arr) {
            try { localStorage.setItem(NOTE_STORAGE_KEY, JSON.stringify(arr)); }
            catch (e) { console.error('save notes', e); }
        }
        function _fmtTime(t) {
            if (!isFinite(t)) return '--:--.--';
            const m = Math.floor(t / 60), s = t - m * 60;
            return `${m}:${s.toFixed(2).padStart(5, '0')}`;
        }
        function _toastNote(text, color = '#5dffb1') {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(0,0,0,0.85);color:${color};border:1px solid ${color};padding:8px 16px;font-family:monospace;font-size:13px;letter-spacing:1px;box-shadow:0 0 12px ${color}55;text-shadow:0 0 4px ${color}88;`;
            t.textContent = text;
            document.body.appendChild(t);
            setTimeout(() => { t.style.transition = 'opacity 0.4s'; t.style.opacity = '0'; }, 1600);
            setTimeout(() => t.remove(), 2100);
        }
        let _noteDialogOpen = false;
        function openAnnotation() {

        document.addEventListener('keydown', (e) => {
            // never intercept while the note dialog is open or the user types in any input
            if (_noteDialogOpen) return;
            const tag = (e.target && e.target.tagName || '').toLowerCase();

            const k = (e.key || '').toLowerCase();

        // --- Visual Functions ---
        let _lyricLineCount = 0;
        // every active typeLine/typeLineDecay setInterval is registered here so
        // clearScreen can stop in-flight typing (fixes "first-screen lyric tail
        // crashing into next screen") and pause/resume can suspend them.
        const _activeTypingTimers = [];
        function _registerTyping(handle) { _activeTypingTimers.push(handle); }
        function _unregisterTyping(handle) {
            const idx = _activeTypingTimers.indexOf(handle);
            if (idx >= 0) _activeTypingTimers.splice(idx, 1);
        }
        // V6.1: adaptive typing — when `duration` (ms) is supplied (auto-injected by
        // dispatcher), compress per-char interval so typing always finishes before the
        // next timeline beat. Defaults to 60ms/char if duration is unset/Infinity.
        function _calcTypeInterval(textLen, duration, base) {
            if (!textLen || !duration || duration === Infinity) return base;
            const tail = 220;
            const target = Math.floor((duration - tail) / textLen);
            return Math.max(22, Math.min(base, target));
        }
        // V6.1 final: animations fire IMMEDIATELY when the lyric line appears, not at
        // typing-end. This keeps the visual peak inside the lyric's audio range
        // (otherwise: type 0.6s → onComplete → animation 1s → next lyric arrives = lag).
        // The legacy "onComplete" name is preserved for compatibility but now fires
        // synchronously on first frame.
        function typeLine({ text, className = '', style = {}, onComplete = null, duration = Infinity }) {
            const line = document.createElement('div');
            line.className = `line ${className}`;
            Object.assign(line.style, style);
            line.innerHTML = `<span class="prompt">C:\\&gt; </span><span class="text"></span><span class="cursor"></span>`;
            visuals.appendChild(line);
            _lyricLineCount++;

            // fire animation hook RIGHT AWAY so the visual rides the lyric range
            if (onComplete) { try { onComplete(); } catch (e) { console.error(e); } }

            const textSpan = line.querySelector('.text');
            const cursor = line.querySelector('.cursor');
            let i = 0;
            const handle = { id: null, paused: false };
            const interval = _calcTypeInterval(text.length, duration, 60);
            const stepFn = () => {
                if (!line.isConnected) {
                    clearInterval(handle.id);
                    _unregisterTyping(handle);
                    return;
                }
                if (i < text.length) {
                    textSpan.textContent += text.charAt(i);
                    i++;
                    visuals.scrollTop = visuals.scrollHeight;
                } else {
                    clearInterval(handle.id);
                    _unregisterTyping(handle);
                    if (cursor.parentNode) cursor.remove();
                }
            };
            handle.id = setInterval(stepFn, interval);
            handle.resume = () => {
                if (!line.isConnected) { _unregisterTyping(handle); return; }
                handle.id = setInterval(stepFn, interval);
                handle.paused = false;
            };
            _registerTyping(handle);
        }

        // ==== V5: typeLineDecay — progressively corrupted lyric ====
        // decayLevel 0..5 (0 = clean, 5 = nearly unreadable)
        const _DECAY_GLYPHS = '▓▒░█╳▙▟▜▛◢◣◤◥▼▲►◄✗⌧※';
        function typeLineDecay({ text, decayLevel = 1, prompt = 'C:\\> ', onComplete = null, duration = Infinity }) {
            const line = document.createElement('div');
            line.className = `line decay decay-${decayLevel}`;
            line.innerHTML = `<span class="prompt">${prompt}</span><span class="text"></span><span class="cursor"></span>`;
            visuals.appendChild(line);
            _lyricLineCount++;
            // V6.1 final: fire animation hook on first frame for in-range visuals
            if (onComplete) { try { onComplete(); } catch (e) { console.error(e); } }
            const textSpan = line.querySelector('.text');
            const cursor = line.querySelector('.cursor');
            // probability of each char being glitched permanently / scrubbed
            const glitchProb = [0, 0.05, 0.12, 0.22, 0.35, 0.48][Math.min(decayLevel, 5)];
            const scrubProb  = [0, 0.0,  0.05, 0.12, 0.22, 0.34][Math.min(decayLevel, 5)];
            let i = 0;
            const basePeriod = 60 - decayLevel * 4;
            const period = _calcTypeInterval(text.length, duration, basePeriod);
            const handle = { id: null, paused: false };
            const stepFn = () => {
                if (!line.isConnected) {
                    clearInterval(handle.id);
                    _unregisterTyping(handle);
                    return;
                }
                if (i < text.length) {
                    const ch = text.charAt(i);
                    const r = Math.random();
                    let span;
                    if (r < glitchProb && ch !== ' ') {
                        span = document.createElement('span');
                        span.className = 'glitch-ch';
                        span.textContent = _DECAY_GLYPHS.charAt(Math.floor(Math.random()*_DECAY_GLYPHS.length));
                        span.dataset.orig = ch;
                        if (Math.random() < 0.5) {
                            const orig = ch;
                            const glyph = span.textContent;
                            let flip = false;
                            const flipper = setInterval(() => {
                                if (!span.isConnected) { clearInterval(flipper); return; }
                                span.textContent = (flip = !flip) ? orig : glyph;
                            }, 90 + Math.random()*80);
                        }
                    } else if (r < glitchProb + scrubProb && ch !== ' ') {
                        span = document.createElement('span');
                        span.className = 'scrub-ch';
                        span.textContent = ch;
                    } else {
                        span = document.createTextNode(ch);
                    }
                    textSpan.appendChild(span);
                    i++;
                    visuals.scrollTop = visuals.scrollHeight;
                } else {
                    clearInterval(handle.id);
                    _unregisterTyping(handle);
                    if (cursor.parentNode) cursor.remove();
                    if (onComplete) onComplete();
                }
            };
            handle.id = setInterval(stepFn, period);
            handle.resume = () => {
                if (!line.isConnected) { _unregisterTyping(handle); return; }
                handle.id = setInterval(stepFn, period);
                handle.paused = false;
            };
            _registerTyping(handle);
        }

            const layer = _spawnKfxLayer('kfx-stimulations');

            // ---- left panel: 6 spike channels ----
            const channelsHTML = ['α', 'β', 'γ', 'θ', 'δ', 'σ'].map((name, i) => {
                // build a repeating spike waveform path that's twice the panel width.
                // we translate this strip -50% to make it scroll seamlessly.
                const W = 1200, H = 28; // viewBox H, baseline at H/2
                let d = `M 0 ${H/2}`;
                let x = 0;
                while (x < W) {
                    const dx = 24 + (i * 7 + x) % 50; // varied spacing
                    x += dx;
                    if (x >= W) break;
                    const spikeUp = (i + (x | 0) >> 0) & 1 ? -10 : -7;
                    d += ` L ${x - 4} ${H/2} L ${x - 1.5} ${H/2 + spikeUp + 2} L ${x} ${H/2 + spikeUp} L ${x + 1.5} ${H/2 + 4} L ${x + 4} ${H/2}`;

                return `<div class="stim-channel">
                    <div class="ch-tag">CH${String(i+1).padStart(2,'0')} ${name}</div>

        function fxFragments(text) {
            // V6.3: memory shards crumble inward as a delete-wave radiates from center.
            // Each shard cracks then spins toward the void, spawning ash motes that drift up.
            const layer = _spawnKfxLayer('kfx-fragments');

            const FRAG_NAMES = [
                'regret.shard', 'sigh.001', 'unsent.txt', 'half-of-us', 'echo.cache',
                'tinyfear', 'pause.dat', 'silent.001', 'almost.tmp', 'ghost.proc',
                'maybe.shard', 'doubt.bin', 'tear.001', 'unsaid', 'old_us',
                'wonder', 'gap.bin', 'still.cache', 'noise.frag', 'sleepless',
                'fade.001', 'ash.0xCC', 'too_late', 'goodbye.tmp', 'mute.echo',
                'half.proc', 'wishlist', 'pointless', 'softly', 'untold',
            ];

            const tag = (text || 'FRAGMENTS').toLowerCase();
            layer.innerHTML = `
                <div class="frag-hud"><span class="blip">●</span> DELETE :: pointless/${tag}/*</div>
                <div class="frag-wave"></div>
                <div class="frag-ticker">
                    <span class="label">DELETE :: pointless</span>
                    <span class="count">28</span>
                </div>
                <div class="frag-null">≈ NULL ≈</div>
            `;

            // V6.1.4: balanced timing — earlier (1.0s) was too fast to read.
            // Shards now collapse 0.30-0.75s, scene finishes ~1.30s + 0.20 fade
            // ≈ 1.50s. Window before next typeLine "Then maybe…" @121.8s is 1.30s,
            // so fade overlaps slightly with start of typing — acceptable.
            const SHARD_COUNT = 22;
            const placed = [];
            const cxPct = 50, cyPct = 50;
            for (let i = 0; i < SHARD_COUNT; i++) {
                // distribute angularly with a small radius jitter
                const angle = (i / SHARD_COUNT) * Math.PI * 2 + (Math.random() - 0.5) * 0.30;
                // donut: avoid center (counter) and edges
                const radiusPct = 16 + Math.random() * 22; // 16..38%
                const xPct = cxPct + Math.cos(angle) * radiusPct * 1.55; // wider horizontally
                const yPct = cyPct + Math.sin(angle) * radiusPct * 0.95;
                const rot = (Math.random() - 0.5) * 24;

                const shard = document.createElement('div');
                shard.className = 'frag-shard';
                shard.style.left = `${xPct.toFixed(1)}%`;
                shard.style.top  = `${yPct.toFixed(1)}%`;
                shard.style.setProperty('--rot', `${rot.toFixed(1)}deg`);
                shard.style.setProperty('--in-d', `${(0.05 + Math.random() * 0.12).toFixed(2)}s`);
                // V6.1.4: wave starts at 0.25s, collapses at 0.30-0.75s.
                const tHit = 0.30 + (radiusPct / 38) * 0.45;
                shard.style.setProperty('--out-d', `${tHit.toFixed(2)}s`);
                shard.style.setProperty('--crack-d', `${(tHit - 0.05).toFixed(2)}s`);
                // outward motion: drift away from center as the shard collapses
                const outDist = 60 + Math.random() * 80;
                shard.style.setProperty('--dx', `${(Math.cos(angle) * outDist).toFixed(0)}px`);
                shard.style.setProperty('--dy', `${(Math.sin(angle) * outDist - 18).toFixed(0)}px`);
                shard.style.setProperty('--spin', `${(Math.random() < 0.5 ? -1 : 1) * (320 + Math.random() * 360)}deg`);
                shard.style.setProperty('--sc-end', (0.18 + Math.random() * 0.28).toFixed(2));
                shard.innerHTML = `<span class="lbl">${FRAG_NAMES[Math.floor(Math.random() * FRAG_NAMES.length)]}</span><span class="crack"></span>`;

                layer.appendChild(shard);
                placed.push({ x: xPct, y: yPct, tHit });
            }

            // Ash motes — bursts spawned just as each shard collapses
            placed.forEach((p) => {
                const burst = 3 + Math.floor(Math.random() * 3);
                for (let k = 0; k < burst; k++) {
                    const ash = document.createElement('div');
                    ash.className = 'frag-ash';
                    ash.style.left = `${(p.x + (Math.random() - 0.5) * 4).toFixed(1)}%`;
                    ash.style.top  = `${(p.y + (Math.random() - 0.5) * 4).toFixed(1)}%`;
                    ash.style.setProperty('--ax', `${((Math.random() - 0.5) * 70).toFixed(0)}px`);
                    ash.style.setProperty('--ay', `${(-90 - Math.random() * 70).toFixed(0)}px`);
                    ash.style.setProperty('--ash-d', `${(p.tHit + Math.random() * 0.18).toFixed(2)}s`);
                    layer.appendChild(ash);
                }
            });

            // Center counter ticks down — synced to new compressed window (0.18..0.85s)
            const counter = layer.querySelector('.frag-ticker .count');
            const startMs = performance.now();
            const tickRaf = () => {
                if (!counter || !counter.isConnected) return;
                const elapsed = (performance.now() - startMs) / 1000;
                if (elapsed < 0.30) {
                    counter.textContent = SHARD_COUNT;
                } else if (elapsed < 1.15) {
                    const left = Math.max(0, Math.round(SHARD_COUNT * (1 - (elapsed - 0.30) / 0.85)));
                    counter.textContent = left;
                } else {
                    counter.textContent = '0';
                    return;
                }
                requestAnimationFrame(tickRaf);
            };
            requestAnimationFrame(tickRaf);

            // V6.1.4: layer self-removes in 1.30s (was 1.0s) — slows the scene
            // so user can read the shard names; 0.20s fade overlaps gently with
            // the start of "Then maybe…" typing.
            setTimeout(() => {
                if (!layer.isConnected) return;
                layer.style.transition = 'opacity 0.20s ease-out';
                layer.style.opacity = '0';
                setTimeout(() => layer.remove(), 220);
            }, 1300);
        }

                const t = Math.min(1, (now - start) / dur);
                const totalMin = 6 * 60 + t * 12 * 60;
                const h24 = Math.floor(totalMin / 60);
                const m = Math.floor(totalMin % 60);
                const am = h24 < 12;
                const h12 = ((h24 + 11) % 12) + 1;
                clockEl.textContent = `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${am ? 'AM' : 'PM'}`;

            requestAnimationFrame(tick);

        let binaryRainInterval;
        function startBinaryRain() {
            const canvas = document.createElement('canvas');
            canvas.id = 'binary-canvas';
            container.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
            const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const nums = '0123456789';
            const alphabet = katakana + latin + nums;
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const rainDrops = [];
            for (let x = 0; x < columns; x++) rainDrops[x] = 1;
            
            binaryRainInterval = setInterval(() => {
                ctx.fillStyle = 'rgba(10, 10, 10, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = varGet('--text-color');
                ctx.font = fontSize + 'px monospace';
                for (let i = 0; i < rainDrops.length; i++) {
                    const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                    ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                    if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        rainDrops[i] = 0;
                    }
                    rainDrops[i]++;
                }
            }, 33);
        }

                canvas.style.transition = 'opacity 0.32s ease-in, transform 0.32s ease-in, filter 0.32s';

            let d = '';

        function startSinePhase() {
            cancelSinePhase();

                if (tangentState.length) {
                    for (const ts of tangentState) {
                        const x = ts.t * SINE_VBW;
                        const y = cy - Math.sin(ts.t * freq + phase) * amp;
                        const slope = -amp * freq * Math.cos(ts.t * freq + phase) / SINE_VBW;
                        const x1 = x - ts.halfW;
                        const y1 = y - slope * ts.halfW;
                        const x2 = x + ts.halfW;
                        const y2 = y + slope * ts.halfW;
                        ts.line.setAttribute('x1', x1);
                        ts.line.setAttribute('y1', y1);
                        ts.line.setAttribute('x2', x2);
                        ts.line.setAttribute('y2', y2);
                        ts.dot.setAttribute('cx', x);

                sinePhaseRAF = requestAnimationFrame(tick);

            'FEM':   { num: 5, native: '5',  flag: '🇸🇪', meta: 'SV',  color: '#5dffb1', rot: -3 },
            'LIU':   { num: 6, native: '六', flag: '🇨🇳', meta: 'CN',  color: '#ff8e8e', rot: 5 },
        };
        let _v5LangStage = null;
        let _v5LangCount = 0;
        let _v5LangCleanupT = null;

        function _ensureLangStage() {
            if (_v5LangStage && document.body.contains(_v5LangStage)) return _v5LangStage;
            _v5LangStage = document.createElement('div');
            _v5LangStage.className = 'v5-lang-stage';
            _v5LangStage.innerHTML = `
                <div class="lang-title">CHAOS :: COUNT IN SIX TONGUES</div>
                <div class="lang-row" id="v5-lang-row"></div>
                <div class="lang-counter">i = <span class="i">0</span> / 6 <span class="badge">SIX TONGUES</span></div>
            `;
            container.appendChild(_v5LangStage);
            _v5LangCount = 0;
            return _v5LangStage;
        }

        function showChaosText({ text }) {
            const key = (text || '').toUpperCase().trim();
            const meta = V5_LANG_NUMBERS[key];
            if (!meta) {
                const e = document.createElement('div');
                e.className = 'chaos-text'; e.textContent = text;
                Object.assign(e.style, {
                    left: `${Math.random()*80}%`, top: `${Math.random()*80}%`,
                    fontSize: `${Math.random()*3+2}em`, color: `hsl(${Math.random()*360}, 100%, 70%)`,
                });
                visuals.appendChild(e);
                setTimeout(() => e.remove(), 500);
                return;
            }
            const stage = _ensureLangStage();
            const row = stage.querySelector('#v5-lang-row');
            const ctr = stage.querySelector('.i');

            const card = document.createElement('div');
            card.className = 'v5-lang-card';
            card.style.color = meta.color;
            card.style.setProperty('--rot', `${meta.rot}deg`);
            card.innerHTML = `
                <div class="lang-flag">${meta.flag}</div>
                <div class="lang-num">${meta.num}</div>
                <div class="lang-native">${meta.native}</div>
                <div class="lang-meta">${key} · ${meta.meta}</div>
            `;
            row.appendChild(card);
            _v5LangCount++;
            if (ctr) ctr.textContent = _v5LangCount;

            // After the 6th, schedule the whole stage to fade out
            if (_v5LangCount >= 6) {
                if (_v5LangCleanupT) clearTimeout(_v5LangCleanupT);
                _v5LangCleanupT = setTimeout(() => {
                    if (!_v5LangStage) return;
                    _v5LangStage.querySelectorAll('.v5-lang-card').forEach((c) => c.classList.add('fading'));
                    setTimeout(() => {
                        if (_v5LangStage) _v5LangStage.remove();
                        _v5LangStage = null;
                        _v5LangCount = 0;
                    }, 500);
                }, 1100);
            }
        }

        // ==== V5: LOVE finale — 3 themed beats (study / quiz / algebra) ====
        let _loveBeatIdx = 0;

        function _buildEcgPath(amp, totalWidth = 600) {
            const segments = [];
            const yMid = 35;
            for (let x = 0; x <= totalWidth; x += 3) {
                let y = yMid;
                const phase = (x % 120);
                if      (phase < 8)  y = yMid;
                else if (phase < 14) y = yMid - amp * 0.5;
                else if (phase < 20) y = yMid + amp * 0.8;
                else if (phase < 26) y = yMid - amp * 2.2;
                else if (phase < 32) y = yMid + amp * 0.5;
                else                 y = yMid + (Math.random() - 0.5) * 0.5;
                segments.push(`${x === 0 ? 'M' : 'L'} ${x} ${y.toFixed(1)}`);
            }
            return segments.join(' ');
        }
        // build a continuously scrolling ECG SVG for a given amplitude
        function _buildLiveEcgSvg(amp) {
            // path is 1800 wide (3x viewport 600), animateTransform scrolls -1200 over 4s,
            // creating an infinite live heartbeat trace
            const d = _buildEcgPath(amp, 1800);
            return `
                <svg viewBox="0 0 600 70" preserveAspectRatio="none">
                    <g>
                        <animateTransform attributeName="transform" type="translate"
                                          from="0 0" to="-1200 0"
                                          dur="4s" repeatCount="indefinite" />
                        <path class="ecg-line" d="${d}" />
                    </g>
                </svg>
            `;
        }

        function _scheduleHearts(stage, count, lifetime, themeColor) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => spawnHeart(themeColor), i * 100 + Math.random() * 60);
            }
            setTimeout(() => stage.remove(), lifetime);
        }

        function loveBeat() {
            _loveBeatIdx++;
            const beat = _loveBeatIdx;
            if (beat === 1) return loveBeatStudy(beat);
            if (beat === 2) return loveBeatQuiz(beat);
            return loveBeatAlgebra(beat);  // beat 3 (climax)
        }

        // LOVE 1 — after "I've studied, I've studied how to properly"
        function loveBeatStudy(beat) {
            const stage = document.createElement('div');
            stage.className = `v5-love-stage beat-${beat} theme-study`;
            stage.innerHTML = `
                <div class="love-head">
                    <span>[ STUDY :: love.curriculum ]</span>
                    <span><span class="pulse">●</span> PAGE 1 / ∞</span>
                </div>
                <ul class="study-list">
                    <li><span>01. <span class="marker-yellow">how to listen</span></span><span class="ok">memorized ✓</span></li>
                    <li style="animation-delay:.10s"><span>02. how to wait</span><span class="ok">memorized ✓</span></li>
                    <li style="animation-delay:.20s"><span>03. how to wait <em>longer</em></span><span class="ok">memorized ✓</span></li>
                    <li style="animation-delay:.30s"><span>04. how to forgive</span><span class="ok">in progress…</span></li>
                </ul>
                <div class="love-ecg">
                    ${_buildLiveEcgSvg(6)}
                </div>
                <div class="love-foot">
                    <span>highlighter :: yellow</span>
                    <span class="ok">homework :: love(you)</span>
                </div>
            `;
            container.appendChild(stage);
            _scheduleHearts(stage, 6, 2600, '#ff8eb6');
        }

        // LOVE 2 — after "Question me, question me, I can answer all"
        function loveBeatQuiz(beat) {
            const stage = document.createElement('div');
            stage.className = `v5-love-stage beat-${beat} theme-quiz`;
            stage.innerHTML = `
                <div class="love-head">
                    <span>[ QUIZ :: love.exam.session ]</span>
                    <span><span class="pulse">●</span> SCORE :: 100%</span>
                </div>
                <div class="qa-list">
                    <div class="qa">                          <span class="q">Q: do you?</span>          <span class="arrow">→</span> <span class="a tick">YES ✓</span></div>
                    <div class="qa" style="animation-delay:.12s"><span class="q">Q: even when I'm gone?</span><span class="arrow">→</span> <span class="a tick">YES ✓</span></div>
                    <div class="qa" style="animation-delay:.24s"><span class="q">Q: forever?</span>           <span class="arrow">→</span> <span class="a tick">YES ✓</span></div>
                    <div class="qa" style="animation-delay:.36s"><span class="q">Q: are you sure?</span>     <span class="arrow">→</span> <span class="a tick">YES ✓</span></div>
                    <div class="qa" style="animation-delay:.48s"><span class="q">Q: ask me again</span>       <span class="arrow">→</span> <span class="a tick">YES ✓</span></div>
                </div>
                <div class="love-ecg">
                    ${_buildLiveEcgSvg(14)}
                </div>
                <div class="love-foot">
                    <span>all answers correct</span>
                    <span class="ok">graded :: A+ ♥</span>
                </div>
                <div class="stamp-pass">PASSED</div>
            `;
            container.appendChild(stage);
            _scheduleHearts(stage, 14, 3100, '#ff8eb6');
        }

        // LOVE 3 (climax) — after "I know the algebraic expression of"
        function loveBeatAlgebra(beat) {
            const stage = document.createElement('div');
            stage.className = `v5-love-stage beat-${beat} theme-algebra`;
            stage.innerHTML = `
                <div class="love-head">
                    <span>[ THEOREM :: love(x, y) ]</span>
                    <span><span class="pulse">●</span> PROOF COMPLETE</span>
                </div>
                <div class="eq-block">
                    <span class="op">lim</span><sub style="font-size:0.55em">x→∞</sub>
                    <span class="op"> &nbsp;∫</span><sup style="font-size:0.55em">∞</sup><sub style="font-size:0.55em">−∞</sub>
                    <span class="var-y">love</span>
                    <span class="op">(</span><span class="var-x">me</span><span class="op">,</span> <span class="var-y">you</span><span class="op">)</span>
                    <span class="op"> &nbsp;dt</span>
                    <span class="op"> &nbsp;=&nbsp; </span>
                    <span class="var-y">∞</span>
                </div>
                <div class="eq-where">where me ∈ self ⊂ you · you = lim<sub>x→∞</sub>(everything)</div>
                <div class="love-ecg">
                    ${_buildLiveEcgSvg(22)}
                </div>
                <div class="love-row">
                    <span>BPM :: ∞</span>
                    <span class="heart-count">♥ ∞ × ∞</span>
                </div>
                <div class="eq-qed">∎ Q.E.D.</div>
            `;
            container.appendChild(stage);
            spawnHeartStorm();
            spawnMegaLove();
            // do NOT auto-remove the algebra stage — let it ride into the trapped/end sequence
        }

        function spawnHeart(color) {
            const h = document.createElement('div');
            h.className = 'v5-heart';
            const x = 25 + Math.random() * 50;
            const y = 35 + Math.random() * 30;
            h.style.left = `${x}%`;
            h.style.top = `${y}%`;
            const dx = (Math.random() - 0.5) * 240;
            const dy = -120 - Math.random() * 200;
            const dr = (Math.random() - 0.5) * 80;
            h.style.setProperty('--dx', `${dx}px`);
            h.style.setProperty('--dy', `${dy}px`);
            h.style.setProperty('--dr', `${dr}deg`);
            h.style.fontSize = `${1 + Math.random() * 1.4}em`;
            if (color) h.style.color = color;
            h.textContent = '♥';
            container.appendChild(h);
            setTimeout(() => h.remove(), 1700);
        }

        function spawnHeartStorm() {
            for (let i = 0; i < 60; i++) {
                setTimeout(() => spawnHeart(), i * 25);
            }
        }

        // ==== V5: graceful end stage (208.5s → song.end) ====
        let _endStageShown = false;
        function showEndStage() {
            if (_endStageShown) return;
            _endStageShown = true;

            // gracefully dim ambient: matrix rain + CRT strips fade
            const rain = document.getElementById('amb-rain');
            if (rain) {
                rain.style.transition = 'opacity 3s ease-out, filter 3s';
                rain.style.opacity = '0.025';
            }
            document.querySelectorAll('.crt-strip').forEach(s => {
                s.style.transition = 'opacity 2.5s ease-out, filter 2.5s';
                s.style.opacity = '0.32';
                s.style.filter = 'blur(0.4px)';
            });

            // sweep away noisy children — but let them fade rather than yank
            const noisy = '.v5-love-stage, .v5-love-mega, .hk-code-flash, .hk-exec-hero, .v5-heart, .emphasis, .emoji-display, .gender-symbol';
            document.querySelectorAll(noisy).forEach(el => {
                el.style.transition = 'opacity 1.6s ease-out, filter 1.6s, transform 1.6s';
                el.style.opacity = '0';
                el.style.filter = 'blur(8px) brightness(1.4)';
            });
            // visuals (lyric column) eases out
            visuals.style.transition = 'opacity 2.0s ease-out, filter 2.0s';
            visuals.style.opacity = '0';
            visuals.style.filter = 'blur(2px)';

            // build the end card
            const songT = song?.duration ? song.duration.toFixed(1) : '???';
            const card = document.createElement('div');
            card.className = 'v5-end-stage';
            card.innerHTML = `
                <div class="end-card">
                    <div class="end-head">
                        <span>[ SESSION :: END ]</span>
                        <span><span class="end-pulse">●</span> SAVE_COMPLETE</span>
                    </div>
                    <div class="end-stats">
                        <div class="row"><span class="key">runtime</span>          <span class="val">${songT}s</span></div>
                        <div class="row"><span class="key">lyric_lines</span>      <span class="val">${_lyricLineCount}</span></div>
                        <div class="row"><span class="key">executions_run</span>   <span class="val">${_execCount}</span></div>
                        <div class="row"><span class="key">love_beats</span>       <span class="val love">∞ × ∞</span></div>
                        <div class="row"><span class="key">love.daemon</span>      <span class="val love">still running…</span></div>
                        <div class="row"><span class="key">exit_code</span>        <span class="val">0  // returned to no one</span></div>
                    </div>
                    <div class="end-msg">
                        <div>world.execute(<span class="em">me</span>) has returned.</div>
                        <div>but <span class="em">love.daemon</span> never terminates.</div>
                        <div class="end-heart">♥</div>
                        <div class="end-quote">— still trapped in the algebraic expression of love —</div>
                    </div>
                </div>
            `;
            document.body.appendChild(card);
            // fade in after the previous content begins to clear
            setTimeout(() => card.classList.add('visible'), 1400);

            // also clear leftover shapes after fade
            setTimeout(() => {
                document.querySelectorAll(noisy).forEach(el => el.remove());
                visuals.innerHTML = '';
            }, 2200);
        }

        function spawnMegaLove() {
            const mega = document.createElement('div');
            mega.className = 'v5-love-mega';
            // big block-letter LOVE (5 lines tall)
            mega.textContent = [
                ' ██╗      ██████╗ ██╗   ██╗███████╗',
                ' ██║     ██╔═══██╗██║   ██║██╔════╝',
                ' ██║     ██║   ██║██║   ██║█████╗  ',
                ' ██║     ██║   ██║╚██╗ ██╔╝██╔══╝  ',
                ' ███████╗╚██████╔╝ ╚████╔╝ ███████╗',
                ' ╚══════╝ ╚═════╝   ╚═══╝  ╚══════╝',
            ].join('\n');
            document.body.appendChild(mega);
            setTimeout(() => {
                mega.style.transition = 'opacity 1.2s ease-out';
                mega.style.opacity = '0';
                setTimeout(() => mega.remove(), 1300);
            }, 6500);
        }

        function showTrappedInLove() {
            const el = document.createElement('div');
            el.className = 'v6-loop-stage';
            el.innerHTML = `
                <div class="loop-head">
                    <span>[ ∞ LOOP :: love.forever ]</span>
                    <span><span class="dot">●</span> NEVER_BREAK</span>
                </div>
                <div class="loop-body">
                    <div class="loop-line"><span class="kw">while</span> (<span class="bool">true</span>) <span class="brace">{</span></div>
                    <div class="loop-line indent" style="animation-delay:.10s">  <span class="this">this</span>.<span class="fn">love</span>(<span class="str">"you"</span>);</div>
                    <div class="loop-line indent" style="animation-delay:.20s">  <span class="kw">if</span> (you.gone) <span class="kw">continue</span>;</div>
                    <div class="loop-line"          style="animation-delay:.30s"><span class="brace">}</span> <span class="heart">♥</span></div>
                </div>
                <div class="loop-foot">
                    <span>i = <span class="v i-counter">0</span></span>
                    <span>break = <span class="v never">null</span></span>
                    <span>state :: <span class="v ok">running</span></span>
                </div>
                <div class="loop-side-glow"></div>
            `;
            visuals.appendChild(el);

            // animate the iteration counter — counts up from 0 with easing
            const counter = el.querySelector('.i-counter');
            let i = 0;
            const startTs = performance.now();
            const tick = () => {
                if (!el.isConnected) return;
                const elapsed = (performance.now() - startTs) / 1000;
                // accelerating count: faster as time passes (love is escalating)
                i += Math.max(1, Math.floor(elapsed * 6));
                if (counter) counter.textContent = i.toLocaleString();
                requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
        }

        // V6.4: cinematic FINAL EXECUTION — three quiet beats (~2.5s) before showEndStage.
        // Beats: (1) hero word fades in red, calm; (2) Java runtime block prints exit lines;
        // (3) hero dissolves upward into ash motes, a heart pulse + coda take over.
        // V6.1 final: catastrophic system destruction in place of the soft graceful
        // dissolve. Phases:
        //  0.00–0.60s  — EXECUTION word slam-in, red, RGB chromatic split, screen jolt
        //  0.50–1.60s  — RuntimeException stack trace floods up the screen
        //  1.40–2.10s  — characters shatter into shards, glitch bars sweep
        //  2.00–2.30s  — overdrive white flash
        //  2.30–3.30s  — black + animated static noise overlay + SIGKILL line
        //  3.30–4.20s  — system-halt coda: "world.exe terminated, exit code -9"
        function finalExecution() {
            document.querySelectorAll('#visuals .emphasis, #visuals .line').forEach(el => el.remove());
            document.querySelectorAll('.v5-love-stage, .v5-love-mega, .v5-heart, .v6-loop-stage, .v6-code-panel').forEach(el => {
                el.style.transition = 'opacity 0.25s ease-out, filter 0.25s ease-out';
                el.style.opacity = '0';
                el.style.filter = 'blur(3px)';
                setTimeout(() => el.remove(), 280);
            });

            const stage = document.createElement('div');
            stage.className = 'v61-final-exec-stage';
            container.appendChild(stage);

            // ---- 0.00s: SLAM-in word ----
            const word = 'EXECUTION';
            const hero = document.createElement('div');
            hero.className = 'fxd-hero';
            hero.innerHTML = word.split('').map((c, i) => {
                return `<span class="ch" style="--ci:${i}; --cdir:${(i % 2 === 0 ? -1 : 1)};">${c}</span>`;
            }).join('');
            stage.appendChild(hero);

            // screen jolt (apply at the same instant)
            container.classList.add('fxd-jolt');
            setTimeout(() => container.classList.remove('fxd-jolt'), 700);

            // ---- 0.50s: stack-trace flood ----
            const stackLines = [
                '<span class="lvl">Exception in thread "main" java.lang.RuntimeException: SOUL_NULL</span>',
                '  at <span class="cls">world.execute</span>(<span class="src">World.java:42</span>)',
                '  at <span class="cls">me.&lt;init&gt;</span>(<span class="src">Self.java:1</span>) <span class="dim">// you</span>',
                '<span class="lvl warn">Caused by: java.lang.IllegalStateException: love.cycle.broken</span>',
                '  at <span class="cls">love.daemon.tick</span>(<span class="src">Love.java:777</span>)',
                '  at <span class="cls">heart.beat</span>(<span class="src">Heart.java:404</span>) <span class="dim">// not found</span>',
                '<span class="lvl fatal">[FATAL] kernel: signal 9 (SIGKILL) sent to pid 0x4D45 — world.exe</span>',
                '<span class="lvl fatal">[FATAL] page fault @0xDEAD_BEEF — memory: protected love region</span>',
                '<span class="lvl fatal">[FATAL] CPU halted — no further execution possible</span>',
                '<span class="dim">>>> dumping core to /dev/null/heart.core ... done.</span>',
                '<span class="dim">>>> attempting recovery ........ <span class="lvl fatal">FAILED</span></span>',
                '<span class="lvl fatal">### KERNEL PANIC :: NOT SYNCING — WORLD CANNOT EXECUTE WITHOUT ME ###</span>',
            ];
            const trace = document.createElement('div');
            trace.className = 'fxd-trace';
            trace.innerHTML = stackLines.map((html, i) =>
                `<div class="fxd-trace-row" style="animation-delay:${(0.5 + i * 0.085).toFixed(2)}s;">${html}</div>`
            ).join('');
            stage.appendChild(trace);

            // ---- 1.40s: shatter the hero word into shards ----
            setTimeout(() => {
                hero.classList.add('shattering');
                // spawn shards per char
                const chars = hero.querySelectorAll('.ch');
                chars.forEach((ch, i) => {
                    const r = ch.getBoundingClientRect();
                    for (let s = 0; s < 4; s++) {
                        const shard = document.createElement('div');
                        shard.className = 'fxd-shard';
                        shard.textContent = ch.textContent;
                        const dx = (Math.random() - 0.5) * 920;
                        const dy = (Math.random() - 0.5) * 700;
                        const rot = (Math.random() - 0.5) * 720;
                        shard.style.cssText = `left:${r.left + r.width/2}px; top:${r.top + r.height/2}px; --sx:${dx.toFixed(0)}px; --sy:${dy.toFixed(0)}px; --sr:${rot.toFixed(0)}deg; animation-delay:${(s * 0.04).toFixed(2)}s;`;
                        stage.appendChild(shard);
                    }
                });
            }, 1400);

            // ---- 1.40s: horizontal glitch bars sweep ----
            setTimeout(() => {
                for (let i = 0; i < 6; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'fxd-glitch-bar';
                    bar.style.top = `${10 + i * 14 + Math.random() * 6}%`;
                    bar.style.height = `${3 + Math.random() * 18}px`;
                    bar.style.animationDelay = `${(i * 0.05).toFixed(2)}s`;
                    stage.appendChild(bar);
                }
            }, 1400);

            // ---- 2.00s: overdrive white flash ----
            setTimeout(() => {
                const flash = document.createElement('div');
                flash.className = 'fxd-flash';
                stage.appendChild(flash);
                setTimeout(() => flash.remove(), 1100);
            }, 2000);

            // ---- 2.30s: blackout + static noise + SIGKILL line ----
            setTimeout(() => {
                const dead = document.createElement('div');
                dead.className = 'fxd-dead';
                dead.innerHTML = `
                    <div class="fxd-static"></div>
                    <div class="fxd-sigkill">
                        <div class="line1">[<span class="kw">SIGKILL</span>] world.exe — terminated</div>
                        <div class="line2">exit code: <span class="num">-9</span></div>
                    </div>
                `;
                stage.appendChild(dead);
            }, 2300);

            // ---- 3.30s: stark coda ----
            setTimeout(() => {
                const coda = document.createElement('div');
                coda.className = 'fxd-coda';
                coda.innerHTML = `
                    <div class="cm">// world.execute(me); never returned</div>
                    <div class="ct">— end of process —</div>
                `;
                stage.appendChild(coda);
            }, 3300);

            // stage stays through showEndStage; song ends ~212s (4.4s after this trigger),
            // so we let showEndStage handle final ambient cleanup beneath our black layer.
        }

        function varGet(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
    </script>
